<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0C0D">
<title>구원교 교주 살인 사건</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&family=Song+Myung&family=Black+And+White+Picture&display=swap">
<style>
/* Layout: 꺼진 극장 — 검은 무대 위 핀 조명 하나. 상단 진행 단계, 본문은 장면, 탐정 노트는 아래에서 올라오는 수첩 */
:root{
  --bg:#0E0C0D; --surface:#1A1618; --raised:#241E21; --ink:#ECE4DC; --muted:#9A8F88; --line:#3A3034;
  --spot:#E8C77A; --spot-ink:#1E1606; --blood:#C2453D; --blue:#7FA6D9; --paper:#EDE3D1; --paper-ink:#2A211A;
  --display:"Nanum Myeongjo",Georgia,serif;
  --body:"Noto Sans KR",-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.75;word-break:keep-all;overflow-wrap:anywhere;background:radial-gradient(ellipse 70% 45% at 50% -5%,rgba(232,199,122,.13),transparent 70%),var(--bg);background-attachment:fixed;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(14,12,13,.94);backdrop-filter:blur(6px);padding-block:10px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.step{font-family:var(--mono);font-size:11px;color:var(--spot);letter-spacing:.06em}
.nb-btn{font:inherit;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--spot);background:transparent;color:var(--spot);cursor:pointer;white-space:nowrap}
.nb-btn b{font-family:var(--mono);font-weight:500;margin-left:4px}
.steps{display:flex;gap:3px}
.steps i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--spot)}
.steps i.done{background:#6b5a3a}
main{display:grid;gap:18px;padding-top:20px}
h1{font-family:var(--display);font-size:30px;line-height:1.3;margin:0;text-wrap:balance;font-weight:800}
h2{font-family:var(--display);font-size:21px;line-height:1.35;margin:0;text-wrap:balance;font-weight:800}
h3{font-size:13px;margin:0;color:var(--muted);font-weight:500;letter-spacing:.06em}
p{margin:0;max-width:62ch}
.prose{display:grid;gap:10px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--muted)}
.quote{border-left:2px solid var(--spot);padding:4px 0 4px 14px;font-family:var(--display);font-size:16px;line-height:1.7}
.title{position:fixed;inset:0;z-index:5;background:#0b0a08;display:flex;justify-content:center;overflow:hidden}
.climg{display:block;width:100%;max-width:220px;margin:10px auto 6px;transform:rotate(-2deg);box-shadow:0 4px 14px rgba(0,0,0,.45);border-radius:2px}
.title img{display:block;height:100%;width:100%;object-fit:contain;object-position:center top}
@media (max-aspect-ratio:3/4){.title img{object-fit:cover}}
.title .tstart{bottom:calc(9% + env(safe-area-inset-bottom,0px))}
.title .tstart{position:absolute;left:50%;bottom:calc(9% + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(240px,58%);font-size:16px;letter-spacing:.3em;background:rgba(20,16,10,.55);color:#e9d8b4;border:1px solid rgba(233,216,180,.55);box-shadow:0 0 24px rgba(233,190,110,.15);backdrop-filter:blur(2px)}
.title .tstart:hover{background:rgba(233,216,180,.12)}
body.ontitle header{display:none}
body.ontitle .nb-btn,body.ontitle #steps{visibility:hidden}
.chat{border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.chathead{display:flex;gap:10px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.chathead b{display:block;font-size:15px}.chathead small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.msgs{display:grid;gap:8px;padding:14px;justify-items:start}
.msg{max-width:84%;background:var(--bg);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:9px 13px;font-size:15px;line-height:1.55;opacity:0;animation:pop .35s ease forwards;animation-delay:var(--d)}
.msg.me{justify-self:end;background:var(--spot);color:#1a140c;border-color:transparent;border-radius:14px 4px 14px 14px}
.msg.file{display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;font:inherit;color:inherit}
.msg.file b{display:block;font-size:14px}.msg.file small{font-size:12px;color:var(--spot)}
.ficon{width:30px;height:36px;flex:none;border-radius:3px;background:linear-gradient(135deg,transparent 8px,var(--spot) 0);position:relative}
.ficon::after{content:"";position:absolute;left:7px;right:7px;top:16px;height:2px;background:#1a140c;box-shadow:0 5px 0 #1a140c,0 10px 0 #1a140c}
.msgs.still .msg:not(.new){animation:none;opacity:1}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.call{display:flex;gap:10px;align-items:flex-start}
.call .bub{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:16px;font-family:var(--display)}
.call .who{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:2px}
.casefile{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:6px 16px 4px;display:grid}
.casefile .cfhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--spot);padding:10px 0;border-bottom:1px dashed var(--line)}
.casefile .cfhead:last-child{border-bottom:0;border-top:1px dashed var(--line);margin-top:4px}
.casefile section{padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:8px}
.casefile section:nth-last-of-type(1){border-bottom:0}
.casefile h3{font-size:12px;letter-spacing:.1em;color:var(--muted);font-weight:600;margin:0}
.casefile p{margin:0;line-height:1.7;font-size:14.5px}
.casefile ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px;line-height:1.6}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.primary{font:inherit;font-weight:700;font-size:15px;padding:14px;border:0;border-radius:12px;background:var(--spot);color:var(--spot-ink);cursor:pointer;width:100%}
.primary:disabled{opacity:.35;cursor:not-allowed}
.ghost{font:inherit;font-size:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--spot);outline-offset:2px}
.av{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;background:var(--raised);border:1px solid var(--line);color:var(--spot)}
.cast{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.castc{display:grid;justify-items:center;text-align:center;gap:4px;padding:14px 8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-width:0}
.castc b{font-size:15px}
.castc small{font-size:12px;color:var(--muted);line-height:1.4}
button.castc{font:inherit;color:var(--ink);cursor:pointer}
button.castc.sel{border-color:var(--spot);box-shadow:inset 0 0 0 1px var(--spot)}
.says{display:grid;gap:10px}
.say{display:flex;gap:12px;align-items:flex-start}
.say .bub{background:var(--surface);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 14px;min-width:0}
.say .who{font-size:12px;color:var(--muted);display:block;margin-bottom:2px}
.say.me{flex-direction:row-reverse}
.say.me .bub{background:var(--spot);color:var(--spot-ink);border-color:transparent;border-radius:14px 4px 14px 14px}
.say.me .who{color:#5a4519}
.budget{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.budget b{font-family:var(--mono);color:var(--spot);font-size:15px;font-weight:500}
.locs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-inline:-2px;padding-inline:2px}
.loc{font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap;flex:none}
.loc.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.loc .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}
.loc .new{font-size:10px;color:var(--blood);margin-left:4px;font-weight:700}
.scene{display:grid;gap:12px}
.scene-desc{color:var(--muted);font-size:14px}
.spots{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.spot{font:inherit;font-size:14px;text-align:left;padding:12px 14px;border-radius:10px;border:1px dashed #5a4c50;background:transparent;color:var(--ink);cursor:pointer;line-height:1.45;min-width:0}
.spot:hover:not(:disabled){border-color:var(--spot);border-style:solid}
.spot.seen{border-style:solid;border-color:var(--line);background:var(--surface);color:var(--muted)}
.spot.seen::before{content:"✓ ";color:var(--spot)}
.spot:disabled{cursor:not-allowed;opacity:.45}
.spot.lockspot{border-color:var(--blood);border-style:solid}
.card{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:14px 16px;display:grid;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:in .35s ease-out}
.card .cn{font-family:var(--display);font-weight:800;font-size:17px}
.card .tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid currentColor;opacity:.8}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.lockbox{display:grid;gap:8px;background:var(--surface);border:1px solid var(--blood);border-radius:12px;padding:14px}
.lockbox .lrow{display:flex;gap:8px}
.lockbox,.lockbox>*,.pop>*{min-width:0}
.lockbox input{flex:1;min-width:0;width:0;font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.lockbox button{font:inherit;padding:10px 14px;border-radius:8px;border:0;background:var(--blood);color:#fff;cursor:pointer;flex:none}
.err{font-size:13px;color:var(--blood)}
.hint{font-size:13px;color:var(--muted)}
.note-overlay{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.note-overlay[hidden]{display:none}
.note{width:100%;max-width:720px;max-height:88vh;background:var(--paper);color:var(--paper-ink);border-radius:16px 16px 0 0;display:grid;grid-template-rows:auto auto 1fr;padding-bottom:env(safe-area-inset-bottom,0px)}
.note-head{display:flex;justify-content:space-between;align-items:center;padding:14px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.note-head h2{color:var(--paper-ink)}
.close{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid #b9ab94;background:transparent;color:var(--paper-ink);cursor:pointer}
.ntabs{display:flex;gap:4px;overflow-x:auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid #cdbfa7}
.ntab{font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:0;background:transparent;color:#6b5d4c;cursor:pointer;white-space:nowrap;flex:none}
.casesum{display:grid;gap:6px}
.casesum h4{font-size:12px;letter-spacing:.08em;color:#8a6d3b;margin:8px 0 0}
.casesum h4:first-child{margin-top:0}
.casesum p,.casesum ul{margin:0;font-size:14px;line-height:1.65}
.casesum ul{padding-left:18px}
.casesum .sub{color:#8a7a62;font-size:13px}
.ntab.on{background:var(--paper-ink);color:var(--paper)}
#overlay .note{height:88vh}
.pin{font:inherit;font-size:18px;line-height:1;background:none;border:0;color:#b9a88a;cursor:pointer;padding:2px 6px 2px 0;margin:0 4px 0 0;vertical-align:-1px}
.pin.on{color:#e0a92e}
.card .pin{color:#8d8170}.card .pin.on{color:#f0b83a}
.evbtn.pinned{border-color:#e0a92e}
.tl{display:flex!important;align-items:center;gap:6px;min-width:0}
.tl .nm{min-width:0;flex:0 1 auto}
.tl .stamp{flex:none;margin-left:2px!important;vertical-align:0!important}
.tl .pin{flex:none;margin:0!important;padding:2px 2px 2px 0}
.nbody{min-height:0;overflow:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:grid;gap:14px;align-content:start}
.nsec{display:grid;gap:6px}
.nsec h4{margin:0;font-size:15px;display:flex;align-items:center;gap:8px}
.foundbar{border:1.5px solid #2c5d9a;color:#2c5d9a;background:#e6eef7;border-radius:8px;padding:10px 12px;font-weight:600;font-size:14px;animation:fin .3s ease}
.foundbar b{display:block;font-size:15px;margin-top:2px}
.ncard.found{border-color:#2c5d9a;box-shadow:0 0 0 2px #2c5d9a}
.foundbar small{display:block;font-weight:400;font-size:12px;margin-top:3px;opacity:.8}
@keyframes fin{from{opacity:0;transform:translateY(-4px)}}
.ncard.hl{animation:hl 1.6s ease}
@keyframes hl{0%,40%{box-shadow:0 0 0 3px #2c5d9a}100%{box-shadow:0 0 0 0 transparent}}
.ncard{border:1px solid #cdbfa7;border-radius:8px;padding:10px 12px;display:grid;gap:6px;background:#f5ecdc}
.ncard p{font-size:14px;line-height:1.6}
.stamp{font-size:11px;font-weight:700;padding:2px 8px;border-radius:4px;border:1.5px solid;transform:rotate(-3deg);display:inline-block}
.stamp.ok{color:#2c5d9a;border-color:#2c5d9a}
.stamp.bad{color:#a5322a;border-color:#a5322a}
.stamp.thin{color:#b07a1e;border-color:#c99a3e}
.stamp.lv-sure{color:#c8473c;border-color:#c8473c;margin-left:6px;vertical-align:2px}
.stamp.lv-amb{color:#9a8a70;border-color:#9a8a70;margin-left:6px;vertical-align:2px}
.lvnote{font-size:12.5px!important;margin:0;padding-left:8px;border-left:2px solid currentColor}
.lvnote.lv-sure{color:#c8473c}.lvnote.lv-amb{color:#9a8a70}
.stamp.none{color:#8b7d6a;border-color:#b9ab94}
.ev{font-size:13px;line-height:1.55;padding-left:14px;position:relative}
.ev::before{content:"";position:absolute;left:2px;top:.65em;width:6px;height:6px;border-radius:50%}
.ev.ok::before{background:#2c5d9a} .ev.bad::before{background:#a5322a} .ev.s::before{background:#6b5d4c}
.ev.bad{text-decoration:none}
.claim{font-size:13px;color:#6b5d4c}
.exc{display:block;font-size:12px;color:#6b5d4c;margin-top:2px}
.claim.struck{text-decoration:line-through;text-decoration-color:#a5322a;text-decoration-thickness:2px}
.dots{font-family:var(--mono);font-size:12px;color:#a5322a;letter-spacing:1px}
.ask{font:inherit;font-size:13px;padding:6px 10px;border-radius:6px;border:1px solid var(--paper-ink);background:transparent;color:var(--paper-ink);cursor:pointer;justify-self:start}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1px solid #b9ab94;background:#fff8ec;color:var(--paper-ink);cursor:pointer}
.reply{font-size:14px;background:#fff8ec;border-radius:4px 12px 12px 12px;padding:8px 12px;border:1px solid #cdbfa7}
.reply b{display:block;font-size:12px;color:#6b5d4c;font-weight:500}
.reply.yes{border-color:#2c5d9a}
.nempty{font-size:14px;color:#8b7d6a;padding:12px;border:1px dashed #b9ab94;border-radius:8px;text-align:center}
.locgroup h4{font-size:13px;color:#6b5d4c;font-weight:500}
.hearts{font-family:var(--mono);color:var(--blood);letter-spacing:3px}
.evlist{display:grid;gap:6px;max-height:300px;overflow:auto;padding-right:4px}
.evbtn{font:inherit;font-size:14px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.evbtn.sel{border-color:var(--spot);box-shadow:inset 0 0 0 1px var(--spot)}
.evbtn small{display:block;font-size:12px;color:var(--muted)}
.ending{display:grid;gap:14px;padding:22px 18px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.ending.true{border-color:var(--spot);box-shadow:0 0 60px rgba(232,199,122,.12)}
.ending.bad{border-color:var(--blood)}
.line{font-family:var(--display);font-size:18px;line-height:1.7;text-align:center;text-wrap:balance;color:var(--spot);padding:10px 0}
.truth .tr strong{display:block;font-weight:600;margin-bottom:3px}
.truthbtns{margin-top:8px}
.evbtn .evd{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45;font-weight:400}
.ncard.fold{padding:0}
details.fold summary{cursor:pointer;padding:10px 12px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:8px}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"＋";color:var(--muted);font-weight:400}
details.fold[open] summary::after{content:"－"}
details.fold .fb{padding:0 12px 12px}
.truthpage{display:grid;gap:22px}
.truthpage h1{font-family:"Nanum Myeongjo",serif;font-size:34px;letter-spacing:-.5px}
.truthpage .line,.truthpage .retort{white-space:nowrap;font-size:clamp(10px,calc((100vw - 48px)/26),17px)!important}
.truthpage .retort{margin:0;text-align:center;font-family:var(--display);line-height:1.8;color:var(--ink)}
.truthpage .retort b{color:#c8473c;font-weight:700}
.truthpage .retort span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;letter-spacing:.1em}
.truthpage section{display:grid;gap:12px}
.truthpage .truth>.eyebrow{display:none}
.truthpage h3{font-size:13px;letter-spacing:.12em;color:var(--spot);font-weight:600}
.truth{display:grid;gap:10px;padding-top:6px;border-top:1px solid var(--line)}
.truth .tr{display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:baseline}
.truth .tr b{font-family:var(--mono);font-size:12px;color:var(--spot);font-weight:500}
.truth .tr p{font-size:14px;line-height:1.65}
.truth .tr small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.flash{font-size:14px;padding:10px 14px;border-radius:10px;background:var(--raised);border:1px solid var(--line)}
@media (max-width:440px){.cast{grid-template-columns:repeat(3,1fr);gap:6px}.castc{padding:12px 4px}.spots{grid-template-columns:1fr}h1{font-size:26px}.brand{font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.msg{opacity:1!important}}
.results{display:grid;gap:10px}
.pop-ov{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pop{width:100%;max-width:560px;max-height:86vh;overflow:auto;display:grid;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:in .25s ease-out}
.pop-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pop-close{font:inherit;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;flex:none}

        `범인을 잡아낼 증거가 부족했다. 결국, 교주의 죽음은 ‘난로 사고’로 처리됐다. 연통이 눈에 막혔다는 것이다. 새벽예배는 취소됐고, 기름부음도 없었다.`,

      `두 사람은 수련회 둘째 날 새벽 다섯 시 반, 태영의 매니저 밴을 타고 마을을 떠나기로 했다. 21:35, 성민은 다과를 들고 사무실 문 앞에 섰다가 교주의 통화를 들었다. 상대는 태영의 매니저였다. 탈출은 이미 새어 나가 있었다.`,

    ["21:35", `면담 다과를 들고 사무실 문 앞에 섰다. 반쯤 열린 문 너머에서 아버지가 전화를 받고 있었다. “박 실장? 그래, 다섯 시 반이라고.” 안에 있던 관리자분과 눈이 마주쳤다. 쟁반을 든 채 돌아섰다.`],
    ["22:39", `기도회. 아버지가 테이프를 멈추고 말했다. “내일 새벽, 이 중 한 사람이 회개할 것이다.” 여덟 명이 고개를 숙였다. 다들 자기 이야기인 줄 알았다. 나만 알았다. 그게 나라는 걸.`],

    ["23:30", `창고. 관리자분은 보일러실로 가고 없었다. 장작 여섯 개. 일지에 늘 같은 글씨로 체크했다.`],
    ["23:40", `대추차를 올리고 장작 여섯 개를 넣었다. 아버지는 다 알고 있었다. 형의 기름부음, 나의 파문, 3번지의 퇴거. “편히 쉬십시오.” 외투를 걸치고 나왔다. 등 뒤에서 열쇠가 돌았다.`],
    ["23:46", `대예배당 복도 끝, 뒷문의 걸쇠를 풀고 골목으로 나갔다. 영하 15도. 연통에서 아직 온기가 새어 나왔다.`],
    ["23:52", `연통 끝에 봉투를 씌우고 테이프를 감았다. 계단 쪽 가로등 아래에서 누군가 영어로 통화하고 있었다. 숨을 죽이고 웅크렸다. 그 사람은 이쪽을 오래 보지 않았다.`],

 t:`회개실 벽 한 칸이 속이 비어 있었다. 벽돌을 빼자 접힌 쪽지 한 장. 연필 글씨가 손톱자국처럼 떨린다.`,
 v:{type:"note", lines:["원진아.","누나는 괜찮아.","네가 데려가도 괜찮아. 네 잘못 아니야.","위에서 네 목소리가 들려. 제일 크게 아멘 하는 거.","그래서 누나는 안 무서워. — 지윤"]},
 q:"회개실 벽 속에서 나온 쪽지입니다. 누나의 글씨입니까?", to:"wonjin", why:"쪽지를 받을 사람 함원진"},

]});

/* =====================================================================
   박세림 대사 (serim.js)
   말투: 1차에는 사무적이다. ‘~입니다’, ‘확인해 드리겠습니다’. 기록과 절차로 말한다.
         2차에 증거가 쌓이면 문장이 끊기고 무너진다.
   `백틱` 안의 글자만 고치면 됩니다. 증거 이름은 evidence.js의 n과 같아야 합니다.
   ===================================================================== */
인물({
  id: "serim", 이름: "박세림", 나이: 26, 이니셜: "박",
  역할: "교주의 비서 · 사무국장",
  사진: "",

  관계: `교주님 비서실장 박세림입니다. 칠 년째 아버지를 보필하고 있습니다. 일정, 재정, 열쇠 관리까지 아버지 손이 닿는 업무는 전부 제 결재를 거칩니다. 아버지께서는 부름을 받으셨습니다. 업무는 계속됩니다. 필요한 자료가 있으시면 말씀해 주십시오.`,
  알리바이: `기도회 땐 설교 테이프를 제가 틀었습니다. 끝나고 사무실에서 앨런 형제님과 서류를 봤어요. 이후 제 방에서 취침했고, 다섯 시에 우빈 형제님과 기도실로 갔습니다.`,
  알리바이요약: `22:30~23:15 기도회(테이프 담당), 23:15~ 사무실(23:30부터 앨런과 함께), 이후 자기 방에서 취침. 05:05 우빈과 기도실로.`,

  지목1: `제가요? …네, 동기는 있어요. 각서 보셨잖아요. 그런데 그 각서는 아버지가 살아 계셔야 의미가 있어요. 돌아가시면 12억은 전부 제 이름으로만 남아요. 저한테 필요한 건 장부 원본이었지, 아버지의 죽음이 아니었어요.`,
  지목2: `…들어간 건, 맞아요. 쓰러진 아버지를 두고 나온 것도. 그건 평생… 지고 갈게요. 그런데 탐정님, 저는 그분 몸에 손끝 하나 대지 않았어요. 정말이에요.`,
  오답엔딩: `세림은 01:31, 장부 원본을 꺼내러 기도실에 들어갔다가 쓰러져 숨을 몰아쉬는 교주를 봤다. 그는 그대로 문을 잠그고 나왔다. 아무도 부르지 않았다. 그날 아침 세림은 횡령범 대신 살인범 혐의로 경찰서에 불려갔다. 요양병원의 어머니는 그 주에 퇴원 조치됐다. 승인 칸마다 교주의 도장이 찍힌 장부는, 강대상 서랍 속에 그대로 남았다.`,

  감싸기: {
    대상: "allen",
    일차: `앨런 형제님은 아닙니다. 23시 30분부터 계속 사무실에서 저와 서류를 검토했습니다. 제가 확인해 드릴 수 있습니다.`,
    이차: `…CCTV, 보셨죠. 앨런 형제님은 잠깐 담배 피우러 나간 거예요. 감싸 준 건… 그 사진들 때문이에요. 앨런 형제님이 의심받으면 장부 사진도 같이 묻히니까. 그게 제 유일한….`
  },

  모른다: [`그건 제 업무 범위가 아닙니다.`, `확인되지 않은 사항입니다.`, `관련 기록이 없습니다.`],
  아니다: [`제 물품이 아닙니다.`],
  누가: [`파악된 바 없습니다.`, `저는 사무실에만 있었습니다.`],
  잘모르는곳: `{장소}{은/는} 제 관리 구역이 아닙니다.`,
  안간곳: `그날 밤 {장소}에는 가지 않았습니다.`,
  내물건아님: `제 {물건}{이/가} 아닙니다.`,

  가면: {
    깨는증거: ["자백 각서", "이체 확인증"],
    깨짐: `(세림이 서류에서 눈을 떼지 않는다. 결재하듯 반듯하던 목소리가 처음으로 갈라진다) …업무 얘기는 그만할게요. 칠 년 동안 아버지라고 불렀어요. 결재 서류에도, 기도에도. 한 번도 믿은 적 없어요. 믿는 척하는 게 제 업무였어요.`,
    지목1: `제가요? 저는 아버지의 손입니다. 손이 머리를 해치는 일은 없습니다. 동기가 성립하지 않습니다.`,
    대사: {
      "엿들은 대화": `업무 관련 대화였습니다. 그 이상은 말씀드릴 수 없습니다.`,
      "강단 아래 설교 테이프": `수련회 첫날 밤마다 틀도록 되어 있습니다. 담당은 저입니다. 칠 년째입니다.`,
      "파문 규정": `규약집 관리도 제 업무입니다. 해당 조항은 아버지께서 직접 작성하셨습니다. 아버지의 뜻입니다.`,
      "비자금 장부 사본": `업무 자료입니다. 개인 소지품은 확인을 삼가 주십시오.`,
      "타다 남은 장부 사본": `폐기 대상 서류였습니다. 업무상 처리했습니다. 그 이상은 말씀드릴 수 없습니다.`,
      "세림의 휴대폰": `개인적인 사항입니다. 업무와 무관합니다.`,
      "쓰지 않은 침대": `…사무실 책상에서 잠들었습니다. 업무가 많아서.`,
      "기도회 녹음": `기도회 진행은 제 업무입니다. 22시 30분 개회, 22시 34분 말씀 테이프, 23시 15분 폐회. 아버지 말씀은 녹음 그대로입니다. 해석은 제 소관이 아닙니다.`
    }
  },


  증거답변: {
    "거꾸로 걸린 여분 열쇠": `…제가 걸었어요. 손이 떨려서… 거꾸로 걸린 줄도 몰랐어요. 칠 년 동안 한 번도 그런 적 없었는데.`,
    "찢긴 장부 한 장": `…제가 찢었어요. ‘박 실장이 혼자 빼돌린 것으로 한다.’ 아버지 글씨예요. 결재란엔 제 이름만 남기라고요. 이 한 장이면 12억이 전부 제 죄가 돼요.`,
    "거꾸로 들리는 목소리": `…그 테이프, 아버지가 직접 녹음하셨어요. 저는 앞면만 틀었어요. 칠 년 동안. 뒷면이 있는 줄은 몰랐어요.`,
    "엿들은 대화": `…장부요. 원본. 아버지가 금고에 넣어 두신. 그게 남아 있는 한 12억은 제 이름이에요. 경찰이 오기 전에 없애고 싶었어요. 사람이 아니라 종이를요.`,
    "카펫 밑의 바닥 문": `회개실이요. …알고 있었어요. 번호는 몰라요. 아버지만 아셨어요. 저는 그 방으로 내려가는 사람들의 서류만 꾸몄어요.`,
    "고해 테이프 상자": `2019년 2월. 제 테이프예요. 어머니 병원비 처음 빌린 날. …그래서 칠 년이었어요.`,
    "녹음 — 04:45 마지막": `04시 45분이면 저는 사무실 책상에 엎드려 있었어요. CCTV에 남아 있을 거예요. …누군가 아침이 오기 전에 치운 거네요. 난로 사고처럼 보이게.`,
    "벽으로 돌려진 사진들": `…아무도 다시 돌려놓지 않네요. 저도요. 칠 년 동안 매일 아침 그 액자 먼지를 닦았는데.`,
    "이체 확인증": `…네. 그 3천만 원은 제가 꺼내려던 돈이에요. 12억 중에 제 손에 들어온 건 한 푼도 없어요. 그런데 이건, 이건 제가 했어요. 어머니 일 년 치 병원비. 십일 분 만에 막혔어요. 아버지가 전화하셨어요. ‘세림아, 내 돈은 하늘의 돈이다.’ 한 시간 뒤에 그 각서가 타이핑돼 있었어요. 어떻게 그렇게 빨리 아셨는지는… 몰라요.`,
    "기도회 녹음": `‘이 중 한 사람이 회개할 것이다.’ 저인 줄 알았어요. 각서가 이미 타이핑돼 있었으니까. 테이프를 넣는 손이 떨렸어요. 칠 년 동안 처음으로.`,
    "시중 보고 수첩": `‘1/16 박세림 실장님 — 저녁에 은행 화면을 오래 봄.’ …그래서 십일 분 만에 막혔던 거예요. 성민 형제님. 차를 내려 주던 그 손으로.`,
    "타다 남은 장부 사본": `…아침에 태웠어요. 누가 사본을 보면, 돈을 꺼낸 사람이 저라는 것만 남으니까. 도장 없는 사본은 저를 죽이는 종이예요. 원본이 아니면 아무 소용이 없어요.`,
    "강단 아래 설교 테이프": [`제가 틀어요. 칠 년째. 그날 밤에도 제가 틀었어요.`, `제가 틀었어요. 칠 년 동안. 한 번도 안 빠지고. …제가 그 말을 칠 년 동안 사람들 귀에 넣었네요.`],
    "파문 규정": `그 조항, 아버지가 직접 쓰셨어요. 쓰고 나서 처음 적용한 사람이… 사모님이셨어요. 저는 그 서류에 도장을 찍었고요.`,
    "교주의 휴대폰": `(휴대폰을 오래 본다) …알고 있었어요. 백업도 제 일이니까. 아무 말도 안 했어요. 지윤 형제님 산기도원 서류도 제가 만들었어요. 저는… 저도 똑같은 사람이에요.`,
    "교주의 열쇠꾸러미": `작은 놋쇠 열쇠는 강대상 서랍 열쇠입니다. 아버지께서는 서랍에 녹음기를 두십니다. 밤 기도를 녹음해 두셨다가 주일 설교 때 ‘방언 기도’로 사용하십니다.`,
    "서랍 속 장부 원본": { 답: `…저예요. 이 장부가 필요한 사람은 저예요. 돈을 꺼낸 건 제 손이지만, 시킨 건 아버지예요. 승인 칸 보세요. 전부 아버지 도장이에요. 이게 있어야… 제가 살아요.`, 알면: { "세림의 고백": `저예요. 이미 말씀드렸잖아요. 그날 밤 칼까지 들고 꺼내려던 게 이거예요. 결국 못 꺼냈어요. 쓰러진 아버지를 보고, 장부도 아버지도 다 두고 도망쳤으니까. 승인 칸 도장 보이시죠. 이게 제 목숨이었어요.`, "자백 각서": `저예요. 그 각서엔 제가 12억을 다 빼돌렸다고 적혀 있죠. 돈을 꺼낸 건 제 손이 맞아요. 시키는 대로. 그런데 승인 칸 보세요, 전부 아버지 도장이에요. 이 장부가 있어야 제가 경찰서에서 살아 나와요.` } },
    "녹음 — 01:31 문이 열린다": { 답: `…저예요. 노크했어요. 대답이 없어서 주무시는 줄 알았어요. 기도하다 그대로 엎드려 주무시는 날이 가끔 있었거든요. 여분 열쇠로 들어갔어요. 장부 원본이 필요했어요. 서랍을 칼로 비집다가 날이 부러졌어요. 그 소리에도 꿈쩍을 안 하셔서… 다가가 보니까, 쓰러져서, 숨을 몰아쉬고 계셨어요. 방은 이상하게 답답했고 머리가 지끈거렸어요. 그대로 나왔어요. 문을 잠그고. 제가 거기 있었다는 걸… 아무도 모르게.`, 새증거: "세림의 고백", 알면: { "세림의 고백": `…말씀드린 그대로예요. 몇 번을 들으셔도 달라지지 않아요. 저는 그분을 두고 나왔어요.` } },
    "CCTV — 01:18": [`…`, { 답: `…네. 저예요. 열쇠랑 커터칼 들고 기도실에 갔어요. 노크하고, 대답이 없어서 주무시는 줄 알고 들어갔어요. 서랍을 비집다 날이 부러졌는데도 꿈쩍을 안 하셨어요. 다가가 보니까 쓰러져서 숨을 몰아쉬고 계셨어요. 저는, 문을 다시 잠그고, 도망쳤어요.`, 새증거: "세림의 고백", 알면: { "세림의 고백": `…말씀드린 그대로예요. 영상까지 있으니 더 할 말도 없네요.` } }],
    "태영의 증언 — 01:36": { 답: `…태영 형제님이 봤군요. 네. 그 시간에 제가 거기서 나왔어요. 아버지가 쓰러져 계신 걸 보고도. 아무도 안 불렀어요.`, 새증거: "세림의 고백", 알면: { "세림의 고백": `…말씀드린 그대로예요. 몇 번을 들으셔도 달라지지 않아요. 저는 그분을 두고 나왔어요.` } },
    "자백 각서": `제가 혼자 쓴 돈이 아니에요. 그런데 아버지는 내일 아침 저를 경찰서에 데려가겠다고 하셨어요. 아버지 대신 제가 들어가는 거예요. 칠 년을… 이렇게 끝내는 거예요.`,
    "비자금 장부 사본": `제 메모, 보셨죠. 돈을 꺼낸 손은 저예요. 하지만 시킨 사람은 따로 있어요. 사본엔 그 도장이 없어요. 그래서… 원본이 필요했어요.`,
    "쓰지 않은 침대": [`…사무실 책상에서 잠들었습니다. 업무가 많아서.`, `사무실에 엎드려 있었어요. 한숨도 못 잤어요. CCTV 보셨잖아요. 눈을 감으면 그 방이 보였어요.`],
    "세림의 휴대폰": [{ 답: `어머니예요. 요양병원에 계세요. 이번 달 못 내면 퇴원 조치래요. 제가 무너지면, 어머니도 끝이에요.`, 알면: { "자백 각서": `어머니예요. 요양병원에 계세요. 내일 퇴원 조치래요. 저는 내일 경찰서에 가고요. 둘 다… 같은 날이에요.` } }],
    "CCTV — 23:48~23:56": `…앨런 형제님은 담배 피우러 나갔어요. 저는 그대로 있었고요. 말 안 한 건… 죄송해요.`,
    "면담 일지": `제 필체입니다. 정모 형제님 발언은 기록에서 뺄지 고민했지만, 전부 기록하라는 지시가 있었습니다.`,
    "미국지부 인수 계약서": `제가 작성한 서류입니다. 앨런 형제님 아버님께는 아직 세부 조항이 전달되지 않았습니다.`,
    "교단 전화 통화 기록": `해당 시간은 면담 중이었습니다. 아버지께서 직접 수신하셨습니다.`
  },

  인정: {
    "방 안의 칼날": `제 커터칼 날이에요. 서랍을 비집다가 부러졌어요.`
  },

  끼어들기: {
    "01:40의 메모": `태영 형제님. 그 시간에 그 복도에 있었다는 건, 태영 형제님도 거기 뭘 하러 왔던 거잖아요. 손에 뭘 감고 있었던 거, 저도 봤어요.`,
    "땅콩버터 병": `참고로 말씀드리면, 아버지의 알레르기는 앨런 형제님도 인지하고 있었습니다. 그 만찬 자리에 있었으니까요.`

  최종추궁: [
    [`당신은 12억 횡령을 뒤집어쓸 처지였습니다.`, `네. 그래서 장부 원본이 필요했어요. 아버지 목숨이 아니라.`],
    [`01:31, 당신은 잠긴 기도실에 들어갔습니다.`, `들어갔어요. 그리고 쓰러져 계신 아버지를 두고 나왔어요. 그건… 제 죄예요.`],
    [`마지막으로 묻겠습니다. 교주를 죽였습니까?`, `아니요. 저는 그분을 살릴 수 있었던 사람이에요. 그런데 안 살렸어요. 그게 죽인 거라면… 네.`]

  반박유형: {"시간": ["시간을 맞춰 보세요. 23:52에 전 사무실 카메라 안에 있었어요. 화면 밖으로 나간 적 없어요.", "01:31에 들어간 건 맞아요. 근데 그분은 이미 쓰러져 있었어요. 숨이 막힌 건 그 전이에요."], "소문": ["누가 그랬어요? …여기 사람들은 남 얘기로 자기 밤을 덮어요.", "귀띔은 증거가 아니에요. 탐정님이 제일 잘 아실 텐데요."], "증언": ["그 말이 맞다고 쳐요. 그게 연통이랑 무슨 상관이죠?", "제가 뭘 숨겼는지는 인정할게요. 사람을 죽인 건 아니에요."], "기타": ["장부도 돈도 다 제 이름이죠. 그분이 그렇게 만들었으니까요. 그분이 죽으면 그 이름은 누가 지워 주는데요.", "그걸로 제가 그분을 미워했다는 건 증명돼요. 연통 앞에 있었다는 건 아니고요."]},

인물({
  id: "allen", 이름: "마앨런", 나이: 26, 이니셜: "마",
  역할: "미국지부장의 아들",
  사진: "",

  관계: `Father Koo. 저희는 LA에서도 그냥 ‘아버지’라고 불러요. 우리 Dad의 스승이시고, 저한텐 할아버지 같은 분이에요. 다섯 살 때 그분 무릎에서 사탕 받아먹었어요. 하늘로 부름을 받으셨으니까… celebrate 해야죠. 그렇게 배웠어요.`,
  알리바이: `기도회 끝나고 사무실에서 세림 씨랑 계약서 봤어요. Boring paperwork. 열두 시 반쯤 손님방 가서 잤어요. Jet lag.`,
  알리바이요약: `22:30~23:15 기도회, 23:15 손님방, 23:30~00:36 사무실(세림과 함께), 이후 손님방.`,

  지목1: `Me? Come on, 탐정님. 저는 그분 죽일 이유가 없어요. 그분은 제 아버지의 아버지 같은 분인데요. …그리고 저 내일 비행기예요. 살인범이 비행기표부터 끊어 놓겠어요?`,
  지목2: `Okay, fine. 그분 끌어내리려고 한 건 맞아요. 사진 열두 장으로. 그건 살인이 아니잖아요. 저는 그분이 살아서, 다 보는 앞에서 무너지는 걸 보고 싶었어요.`,
  오답엔딩: `앨런은 23:47, 교주의 장부 열두 장을 LA로 보냈다. 아버지가 평생 섬긴 그 인간을 끌어내리기 위해. 23:52, 그는 뒷문 계단에서 연통 앞에 웅크린 그림자를 봤다. 관리인인 줄 알았다. 그가 조금만 더 오래 그쪽을 유심히 봤다면 그날 밤은 달라졌을까. 그는 대신 아버지와 통화했다. ‘Dad, I sent them.’ 아버지는 수화기 너머에서 처음으로 울었다. 구원교는 교인이 죽었을 때 울어서는 안 된다. 앨런은 아버지를 이해할 수 없었다.`,

  모른다: [`I don't know, 진짜 몰라요.`, `저는 손님이잖아요. Just a guest.`, `음… no idea?`],
  아니다: [`Not mine. 제 스타일 아니에요.`],
  누가: [`I have no idea. 여기 사람들 다 비슷하게 생겨서요. Just kidding.`, `저한테 물으시면 곤란한데.`],
  잘모르는곳: `{장소}요? 거기 어딘지도 잘 몰라요. Tour 안 해 줬거든요.`,
  안간곳: `{장소}엔 안 갔어요. Promise.`,
  내물건아님: `제 {물건} 아니에요. Not my thing.`,

  가면: {
    깨는증거: ["미국지부 인수 계약서", "CCTV — 23:48~23:56"],
    깨짐: `(앨런이 웃으려다 그만둔다. 영어가 사라진다) …됐어요. 그만할게요, 이 연기. 저는 그 사람을 아버지라고 부른 적 없어요. 입으로만요. Dad가 그 사람 앞에서 평생 무릎 꿇고 사는 걸 봤거든요.`,
    지목1: `Me? Come on. 그분은 우리 Dad의 아버지 같은 분이에요. 다음 주면 LA 지부가 본부랑 하나가 되는데요. 축복받을 일만 남았어요. …그리고 저 내일 비행기예요.`,
    대사: {
      "엿들은 대화": `Just paperwork! 계약서 얘기였어요. 진짜로요.`,
      "파문 규정": `파문. LA엔 아직 없는 조항이에요. 다음 주부터 생기겠네요, 하나가 되니까. Amen.`,
      "산기도원 이송 명단": `LA에도 이런 데 있어요. ‘수양관.’ 회개하러 가는 곳. …좋은 곳이라고 들었어요.`,
      "기도회 녹음": `Prayer meeting. 다들 한 목소리로 아멘 하는 거, beautiful했어요. 진짜로요.`

  },


  증거답변: {
    "LA행 편도 항공권": `Dad가 끊어 줬어요. 계약서에 사인만 받으면 바로 오라고. …이제 사인해 줄 사람이 없네요. 표는 그대로인데.`,
    "찢긴 장부 한 장": `12억… 그중 3억은 LA로 왔다고 했어요. Dad 명의로. (얼굴이 굳는다) 근데 이건… 세림 씨 혼자 뒤집어쓰게 써 놨네요.`,
    "엿들은 대화": `Ledger. 장부 원본이요. ‘그 사람은 이제’ 다음은… 이제 우리를 못 묶는다, 그 말이었어요. Not what you think.`,
    "벽으로 돌려진 사진들": `Creepy. 근데 솔직히 좀 낫네요. 그 얼굴이 계속 따라오는 것보다.`,
    "익명 제보 메일": { 답: `…Okay, that's me. 메일은 익명이라고 했잖아요. LA 지부로 매달 명단이 와요. ‘기도 요청.’ 그 이름들 보고 Dad는 밤새 기도만 했어요. 기도만. 그래서 제가 보냈어요. 기자가 이미 들어와 있다는 답장이 왔고요. 누군지는 몰라요. Seriously.`, 알면: { "기자증": `(탐정의 얼굴을 본다) …잠깐. 그 기자, 찾으셨어요? 이 안에 있었어요? Wow. 그럼 우리 둘 다 신도인 척 아멘 하고 있었던 거네요. 서로 모르고.` } },
    "기도회 녹음": `솔직히요? 소름 끼쳤어요. 여덟 명이 한 박자도 안 틀리고 똑같은 말을 해요. 저도 했어요. 입이 저절로 움직이더라고요. 그게 제일 무서웠어요.`,
    "뒷문 계단의 담배꽁초": { 답: `몰래 피운 거라니까요. 언제였는지는 노코멘트. 금연 교회에서 흡연이 살인보다 큰 죄 같거든요, 여기선.`, 알면: { "앨런의 증언 — 연통 앞 그림자": `말씀드렸잖아요. 그날 밤 그 계단에서 피웠어요. 그리고 연통 쪽에 웅크린 사람을 봤고요.`, "CCTV — 23:48~23:56": { 답: `…CCTV까지 보셨구나. Okay. 그날 밤 열한 시 오십 분쯤, 그 계단에서 피운 거예요. Dad랑 통화하면서. 그리고— 연통 쪽 어둠 속에 누가 웅크리고 있었어요. 뭘 만지길래 관리자분인 줄 알았죠. 걸쇠는 제가 나갈 때 이미 풀려 있었고요.`, 새증거: "앨런의 증언 — 연통 앞 그림자" } } },
    "성민의 패딩": { 답: `Nice jacket. 근데 소매가 왜 이래요? 녹았네.`, 알면: { "앨런의 증언 — 반사띠": `(소매를 오래 본다) …이 줄. 그날 밤 연통 앞에서 번쩍인 게 바로 이거였어요. 녹은 자국 바로 위에 반사띠. 이게 누구 거라고요?`, "앨런의 증언 — 연통 앞 그림자": { 답: `(소매를 오래 본다) …Wait. 이 반사띠. 그날 밤 연통 앞에서 그 사람이 팔을 움직일 때 하얀 줄이 번쩍했어요. 가로등 빛에. 관리자분이 아니었어요. 이거였어요.`, 새증거: "앨런의 증언 — 반사띠" } } },
    "파문 규정": `Wow. 살아 있는 사람 장례를 치른다고요? LA 지부엔 이 조항 없어요. Dad가 끝까지 안 넣었거든요. 그래서 지부를 뺏기는 거고요. Funny, huh?`,
    "교주의 휴대폰": `(웃음이 멎는다) Jesus… ‘너만 특별히 안수해 주마.’ LA에도 이런 문자 받은 사람들 있었어요. Dad가 그 사람들 데리고 나오려다 찍혔고요. …이게 제가 보낸 사진보다 훨씬 확실한 증거네요.`,
    "산기도원 이송 명단": `LA에도 이런 데 있어요. ‘수양관.’ 이름만 예쁘죠. Dad가 거기 사람들 빼내려다 미움받았어요.`,
    "미국지부 인수 계약서": [`아, 그거요. Dad가 다음 주에 서명하러 와요. 본부랑 하나가 되는 거죠. Great news, right?`, `Okay, 솔직히 말할게요. Dad가 평생 지킨 교회를 뺏는 계약이에요. 서명하면 Dad는 ‘고문’. 이름만 남는 거예요. Nice title, no power.`],
    "CCTV — 23:48~23:56": { 답: `…Busted. 담배 피우러 나갔어요. 뒷문 계단에서. 여기 담배 금지잖아요. Dad랑 통화도 했고요. 그리고— 연통 쪽에 누가 있었어요. 웅크리고. 뭘 만지길래 관리자분인 줄 알았어요. 아, 걸쇠는 제가 나갈 때 이미 풀려 있었어요. Seriously.`, 새증거: "앨런의 증언 — 연통 앞 그림자", 알면: { "앨런의 증언 — 연통 앞 그림자": `네, 그 8분이 제가 계단에 있던 시간이에요. 이미 다 말씀드렸잖아요. 연통 앞 그 사람 얘기까지.` } },
    "뒷문 계단에서 연통까지": { 답: `계단이요? 저는 그 시간에 사무실에 있었다니까요. 세림 씨랑. 그다음엔 침대랑 jet lag랑.`, 알면: { "CCTV — 23:48~23:56": { 답: `…CCTV 보셨군요. Okay. 네, 여기 앉아 있었어요. 열한 시 오십 분쯤. 저 어둠 속에 누가 웅크리고 있었어요. 뭘 만지길래 관리인인 줄 알았죠. 그리고 제가 나올 때 걸쇠는 이미 풀려 있었어요. 누가 먼저 나갔다는 거예요.`, 새증거: "앨런의 증언 — 연통 앞 그림자" } } },
    "땅콩버터 병": [`제 아침이에요. 한국 빵은 너무 달아서. …알레르기요? Come on, 저는 그분 방 근처에도 안 갔어요.`, { 답: `얼굴 보셨잖아요. 부은 데 하나 없었죠? 알레르기면 그렇게 안 돼요. 그분 음식엔 손도 안 댔어요. Trust me.`, 알면: { "검안 메모": `부은 데 없었다면서요. See? 그냥 제 아침이었다니까요. Peanut butter is innocent.` } }],
    "앨런의 통화 기록": { 답: `Dad요. 칠 분. 사무실 밖 복도에서 했어요. 세림 씨 앞에서 하기 좀 그래서.`, 알면: { "CCTV — 23:48~23:56": `Dad요. 칠 분. …Okay, 복도 아니고 뒷문 계단. 담배 피우면서. Dad가 울었어요. 태어나서 처음 들었어요, Dad 우는 거.` } },
    "관리인 점퍼": { 답: `그걸 왜 저한테 물어보시죠? 연통 앞을 지나친 적 없어요.`, 알면: { "앨런의 증언 — 연통 앞 그림자": { 답: `…No. 이 점퍼는 아니에요. 그 사람이 팔을 움직일 때 소매에서 하얀 줄이 번쩍했어요. 가로등 빛에. Reflective stripe. 이건 반사띠가 없잖아요.`, 새증거: "앨런의 증언 — 반사띠" } } },
    "수련회 단체 패딩": [`Cool jacket. 저도 하나 받았어요. LA 손님 선물이래요. 사이즈가 좀 커요.`, { 답: `Cool jacket. 저도 있어요.`, 알면: { "앨런의 증언 — 연통 앞 그림자": { 답: `Wait. 이 소매 줄… 그날 밤 연통 앞에서 번쩍인 게 이거였어요. 가로등 빛 받아서. 관리인이 아니었어요. Oh my god.`, 새증거: "앨런의 증언 — 반사띠" } } }],
    "녹음 — 23:52 벽 너머": { 답: `영어요? 이 마을에 영어 하는 사람이 저 하나라서요? That's racist, 탐정님. 그 시간엔 사무실에 있었어요. 세림 씨한테 물어보세요.`, 알면: { "CCTV — 23:48~23:56": `…Fine. 그 목소리 저예요. ‘Dad, I sent them.’ 뒷문 계단에서 통화하던 거요. 연통 바로 앞 아니에요. 테이프 소리랑 비교해 보세요. 얼마나 멀리서 들리는지.` } },
    "풀린 뒷문 걸쇠": { 답: `뒷문이요? 몰라요. 그 문 쓸 일이 없어요, 저는.`, 알면: { "CCTV — 23:48~23:56": `제가 나갈 때 이미 풀려 있었어요. 열한 시 사십팔 분쯤. 그래서 쉽게 나갔죠. 누가 먼저 열어 둔 거예요.` } },
    "서랍 속 장부 원본": `이게 원본이에요? Damn. 제가 찍은 건 사본이었어요. 도장 있는 걸 찍었어야 했는데.`,
    "교주의 성경": `Dad 성경에도 같은 줄 그어져 있어요. 똑같은 자리에. 스승이랑 제자는 밑줄도 닮나 봐요.`
  },

  인정: {
    "뒷문 계단의 담배꽁초": `…Guilty. 제 거예요. 여기 담배 금지라서 몰래 피웠어요. 언제 피웠냐고요? …그건 노코멘트.`
  },

  끼어들기: {
    "쌀포대와 철사": { 답: ``, 알면: { "CCTV — 23:48~23:56": `Rice bags… 관리자분, 그날 밤 연통 앞에 웅크리고 있던 거 그쪽 아니었어요? 저 그때 관리자분인 줄 알았거든요.` } },
    "음원 사재기 정산서": `Hold on. 미국지부 송금 내역에도 같은 금액 있어요. ‘문화선교.’ Now it makes sense.`
  },

  최종추궁: [
    [`당신 아버지의 지부는 사흘 뒤 본부로 넘어갈 예정이었습니다.`, `그래서 장부를 찍었어요. 칼 말고 카메라로. 21세기잖아요.`],
    [`23:48부터 8분, 당신은 뒷문 밖에 있었습니다.`, `계단에 있었어요. Dad랑 통화하면서. 통화 기록 있잖아요.`],
    [`마지막으로 묻겠습니다. 교주를 죽였습니까?`, `(웃음기 없이) No. 저는 그분이 살아서 무너지길 바랐어요. 죽어 버리면… Dad는 끝내 그분을 미워하지 못할 거예요.`]
  ],
  반박유형: {"시간": ["23:52? I was on the phone with Dad. 통화 기록 보세요. 8분, 쭉 LA랑.", "자리 비운 건 맞아요. 담배 피우면서 통화했어요. 연통 쪽은 안 갔어요. 거기 어두워서 무서워요, honestly."], "소문": ["Who said that? 여기 사람들 gossip 진짜 좋아하네요.", "그거 그냥 소문이잖아요. 소문으로 사람 잡으면 안 되죠."], "증언": ["그 사람 말만 믿으세요? 그 사람도 뭔가 숨기고 있을걸요.", "Okay, 그건 제가 했어요. 근데 그게 murder는 아니잖아요."], "기타": ["돈 문제는 Dad 문제예요. 저는 심부름이었어요.", "그래서 motive가 있다는 거죠? 여기 motive 없는 사람 있어요?"]},
  증거반박: {
    "뒷문 계단에서 연통까지": [`뒷문 계단에서 연통까지 8미터. 당신은 그 8분 동안 자리를 비웠습니다.`, `8미터면 가깝죠. 근데 전 계단에서 Dad랑 통화했어요. 그래서 그 그림자를 본 거고요.`],
    "CCTV — 23:48~23:56": [`23:48부터 8분, 당신은 사무실을 비웠습니다.`, `그 8분 동안 저는 LA랑 통화 중이었어요. 7분 2초. 통화 기록 보세요.`],
    "땅콩버터 병": [`교주는 땅콩 알레르기였습니다.`, `얼굴 부은 데 하나 없었다면서요. 알레르기면 그렇게 안 돼요. Case closed.`],
    "뒷문 계단의 담배꽁초": [`뒷문 계단은 연통에서 8m 떨어져 있습니다.`, `그러니까요. 녹음 속 제 목소리 멀리서 들리잖아요. 연통 앞이 아니라 계단에서.`]
  }
});

/* =====================================================================
   구정모 대사 (jeongmo.js)
   말투: 화를 억누르는 젠틀한 존댓말. 후계자답게 단정하다. 성민 이야기에서만 말이 풀어진다.
   `백틱` 안의 글자만 고치면 됩니다. 백틱(`), 쉼표, 괄호는 지우지 마세요.
   증거 이름은 evidence.js의 n(이름)과 똑같아야 합니다.
   [ `1차`, `2차` ] — 1차·2차 현장 검증 때 다르게 말합니다.
   { 답: `…`, 새증거: "증거 이름" } — 대답을 듣는 순간 증언이 증거로 남습니다.
   { 답: `…`, 알면: { "증거 이름": `…` } } — 그 증거를 이미 찾았으면 다른 대사를 합니다.
   ===================================================================== */
인물({
  id: "jeongmo", 이름: "구정모", 나이: 25, 이니셜: "구",
  역할: "교주의 아들 · 후계자",
  사진: "",

  관계: `제 아버지입니다. 그리고 우리 모두의 아버지시죠. 오늘 새벽, 저는 그분의 자리를 이어받기로 되어 있었습니다. 아버지는 기도 중에 부름을 받으셨습니다. 슬퍼하지 않겠습니다.`,
  알리바이: `기도회가 끝나고 곧장 숙소로 갔습니다. 성민이, 원진이와 같은 방입니다. 그 뒤로는 밤새 방에서 기도했습니다.`,
  알리바이요약: `22:30~23:15 기도회, 이후 아침까지 1호실. 기도실 근처엔 가지도 않았다고 말함.`,

  지목1: `…저를 의심하시는 건 당연합니다. 숨기지 않겠습니다. 저는 그분이 돌아가시길 바랐습니다. 그 사람은 내게도, 신도들에게도 아버지라 불릴 자격이 없는 사람입니다. 다만 탐정님, 그 문은 안에서 잠겨 있었습니다.`,
  지목2: `그 사람은 내게도, 신도들에게도 아버지라 불릴 자격이 없는 사람입니다. 죽이러 간 것도 맞습니다. 로프를 들고 갔습니다. 그런데 문은 끝내 열리지 않았습니다. 제가 아버지라고 불렀는데도요.`,
  오답엔딩: `정모는 새벽 두 시, 로프를 들고 기도실 문을 두드렸다. ‘아버지, 저예요.’ 평생 그 말에만 열리던 문이 그날은 열리지 않았다. 그는 끝까지 성민의 알리바이를 보증했다. 성민은 아닐 거라 믿었다. 아버지를 잃었으나 상관없었다. 어머니를 산으로 보낸 사람이었으니까. 정모는 자신이 지키려 한 사람이 아버지의 문을 영원히 닫은 사람이라는 것은, 끝내 알지 못했다. 아니. 알려고 하지 않았다.`,

  감싸기: {
    대상: "sungmin",
    일차: `성민이는 아닙니다. 그 애는 차를 올리고 곧장 숙소로 왔어요. 제가 들어갔을 때 먼저 와 있었고요. …성민이는 그런 애가 아니에요. 제가 압니다.`,
    이차: `성민이는 아닙니다. 제가 보증합니다. 열한 시 오십 분쯤 별관을 지나는데 1호실 불이 켜져 있었어요. 성민이가 와 있었던 겁니다. 그 애는… 벌레 하나 못 죽이는 애예요.`
  },

  모른다: [`글쎄요. 제가 답할 수 있는 일이 아닌 것 같습니다.`, `그건 저도 처음 듣습니다.`],
  아니다: [`제 것이 아닙니다.`, `처음 보는 물건입니다.`],
  누가: [`모르겠습니다. 이 마을에선 모두가 무언가를 숨기니까요.`, `제가 아는 바는 없습니다.`],
  잘모르는곳: `{장소} 일은 제가 잘 모릅니다.`,
  안간곳: `그날 밤 {장소}에는 가지 않았습니다.`,
  내물건아님: `제 {물건}{이/가} 아닙니다.`,

  가면: {
    깨는증거: ["산기도원 회개 일지", "어머니의 입소 서약서"],
    깨짐: `(단정하던 어깨가 천천히 내려간다. 정모가 처음으로 탐정의 눈을 똑바로 본다) …아멘은 이쯤 하겠습니다. 칠 년 동안, 그 사람을 아버지라고 부를 때마다 목이 막혔습니다.`,
    지목1: `저를요? 저는 그분의 아들입니다. 오늘 새벽 그 칼라를 물려받을…. (말이 끊긴다. 한참 뒤, 목소리가 낮아진다) …아니요. 숨기지 않겠습니다. 그 사람은 내게도, 신도들에게도 아버지라 불릴 자격이 없는 사람입니다. 다만 탐정님, 그 문은 안에서 잠겨 있었습니다.`,
    모른다: [`아버지께서 아실 일입니다.`, `저는 기도만 했습니다.`],
    누가: [`아버지는 모든 것을 보셨습니다. 저는 모릅니다.`, `누구도 아버지를 해칠 수 없습니다.`],
    대사: {
      "서랍에서 꺼낸 것": `아버지께서 맡겨 두신 물건입니다. 기도실과는 상관없습니다.`,
      "면담 일지": `…제가 그렇게 말했습니다. 부끄러운 일입니다. 아버지께 회개했고, 아버지는 용서하셨습니다. 그분은 그런 분이셨습니다.`,
      "강단 아래 설교 테이프": `‘우는 것은 아버지를 의심하는 것입니다.’ 그렇습니다. 그래서 저는 울지 않습니다. 오늘도.`,
      "파문 규정": `아버지의 규약입니다. 길을 잃은 양을 위한 마지막 사랑이라고 배웠습니다.`,
      "새벽예배 순서지": `오늘 새벽 제가 받기로 한 자리입니다. 영광이었습니다. …영광입니다.`,
      "책상 위 액자": `아버지의 젊은 날입니다. 그때나 지금이나 같은 분이셨습니다.`,
      "교주의 성경": `‘나로 말미암지 않고는 아버지께로 올 자가 없느니라.’ 아버지께서 가장 사랑하신 구절입니다. 저도 외웁니다.`,
      "산기도원 이송 명단": `회개가 필요한 형제자매들입니다. 산기도원은 사랑의 자리라고 배웠습니다.`,
      "어머니의 산기도원 기록": `어머니는 기도 중에 소천하셨습니다. 아버지께서 그렇게 말씀하셨습니다. (카드 맨 아래 줄에서 눈이 멈춘다) …그 메모는 처음 봅니다.`,
      "기도회 녹음": `‘이 중 한 사람이 회개할 것이다.’ 아버지는 언제나 아셨습니다. 그게 누구인지는… 저도 모릅니다.`
    }
  },


  증거답변: {
    "거꾸로 들리는 목소리": `순애… 어머니 이름입니다. ‘거기’가 어디인지는… 모르겠습니다. 정말로.`,
    "고해 테이프 상자": `‘구정모 — 2019. 3. 3. 서명.’ …제가 서명하던 날도 녹음했군요. 그 방에서 무슨 말을 했는지 기억도 안 납니다. 아멘만 했겠죠. ‘이순애’ 테이프는 그 바로 옆에 있네요.`,
    "서랍에서 꺼낸 것": `(주머니에서 꺼내 손바닥에 올린다) 반지입니다. 어머니 반지. 산으로 가던 날 그 사람이 빼앗아 서랍에 넣었습니다. 칠 년 동안 거기 있는 걸 알면서 못 꺼냈어요. 오늘에야.`,
    "이순애의 마지막 고해": `(이어폰을 오래 귀에 대고 있다) …‘너는—’ 다음이 없네요. 칠 년 동안 그다음이 궁금했습니다. 이제 영영 모르겠네요.`,
    "카펫 밑의 바닥 문": `(얼굴이 하얗게 질린다) …그 방을, 아직 쓰고 있었습니까.`,
    "지하 회개실": `어머니도 산에 가기 전 사흘을 여기서 보냈습니다. 저는 그 사흘 밤, 바로 위에서 아멘을 했고요.`,
    "연통 받침의 반사 실밥": `단체 패딩… 저도 입었습니다. 그날 밤 연통 쪽엔 가지 않았습니다. 그건 확실합니다.`,
    "벽으로 돌려진 사진들": `저는 아닙니다. …그런데 아무도 다시 돌려놓지 않는군요. 저도요.`,
    "녹음 — 04:45 마지막": `네 시 사십오 분이면 저는 자고 있었습니다. …누군가 아침에 문을 열 사람들을 생각했군요. 난로 사고로 보이게.`,
    "어머니의 입소 서약서": `…제가 썼습니다. 열아홉이었어요. 아버지가 펜을 쥐여 주셨습니다. ‘네 엄마를 사랑하면 쓰거라.’ 그 전날 밤 어머니가 저를 데리고 마을을 나가려 했다는 것도, 그래서 보내지는 거라는 것도 알면서 썼습니다. 어머니를 산에 보낸 건 아버지가 아니라 제 이름입니다. …성민이한테도 말 못 했습니다.`,
    "기도회 녹음": `‘정모야, 내일 새벽, 네 자리다.’ 그 말을 듣는데 목에 칼라가 감기는 것 같았습니다. 회개할 한 사람이요? 저인 줄 알았습니다. 여권 이야기가 새어 나간 줄 알고요. 그래서 열한 시 십오 분에 끝나자마자 방으로 가서 짐을 쌌습니다.`,
    "산기도원 동행 기록": `준호 형. 저도 압니다. 원진이가 그 산에서 돌아와 일주일 동안 말을 안 했습니다. 그때 알아봤어야 했는데.`,
    "트럭 운행 쪽지": `관리자분이… 그런 일을. 알았다면 진작 부탁드렸을 겁니다. 성민이와 둘이.`,
    "시중 보고 수첩": `…시중은 원래 그런 자리입니다. 저도 시중일 때 쓰라고 배웠어요. 저는 한 줄도 쓰지 않았지만.`,
    "녹음 — 01:58 아버지": `…네, 제 목소리입니다. 로프를 들고 갔습니다. 아버지라고 불렀어요. 그렇게 부르면 열어 주실 줄 알았습니다. 평생 그 말에만 문을 열어 주던 분이니까요.`,
    "새벽예배 순서지": `네. 제가 원한 적은 한 번도 없습니다. 그 자리에 앉으면, 저도 그 사람이 되는 겁니다. 같은 칼라를 매고, 같은 구절을 읽고.`,
    "녹음 파일의 공백": [`화장실에 다녀왔습니다.`, `…여권을 가지러 갔습니다. 교주 방 금고에요. 삼 년 동안 그 안에 있었습니다. 제 여권인데도요.`],
    "면담 일지": `네. 제가 그렇게 말했습니다. 진심이었습니다. 지금도 거둘 생각은 없습니다.`,
    "금고 열림 기록": [`비밀번호요? 제 생일입니다. 그분은 제 생일로 모든 걸 잠가 두셨죠. …제가 열었느냐고요? 글쎄요.`, `제가 열었습니다. 열한 시 오십사 분. 여권을 꺼내러.`],
    "어머니의 산기도원 기록": [`…네. 제 어머니입니다. 기도 중에 소천하셨다고 들었습니다. 그 메모는 처음 봅니다.`, `제 어머니입니다. 어젯밤 여권을 꺼내다 이 카드를 처음 봤습니다. ‘끝까지 회개하지 않음.’ 어머니는 저를 데리고 마을을 나가려다 그곳에 보내지셨습니다. 그 종이를 보고 나서… 가방에서 로프를 꺼냈습니다.`],
    "산기도원 회개 일지": [`…(한참 동안 말이 없다) 기억합니다. 열아홉 살이었어요. 아버지가 차에 태워 산으로 데려가셨습니다. 창문 너머로 어머니가 보였어요. ‘네 엄마가 회개하게 기도해라.’ 저는 기도했습니다. 그게 제가 한 일입니다.`, `어젯밤 이 공책을 읽었습니다. ‘장례는 축제로. 아무도 울지 않도록.’ 저는 그날 울지 않았습니다. 시키는 대로. …탐정님, 저는 그날부터 그분을 죽이고 싶었던 것 같습니다.`],
    "정모 가방 속 로프": [`등산용입니다. 수련회가 끝나면 산에 갈 생각이었습니다.`, `그분 목에 감으려고 했습니다. …표정을 보니 이미 아시는 것 같군요.`],
    "꾸려 둔 짐 두 개": [`수련회가 끝나면 바로 집에 갈 생각이었습니다.`, `다섯 시 반에 떠나려고 했습니다. 성민이와 함께요. 태영이 매니저 차로. 바다로 가려고 했어요.`],
    "목의 붉은 줄": [`로프 자국이냐고 묻고 싶으신 거겠죠. 제 로프는 가방에 그대로 있습니다.`, `칼라 자국이라고 하더군요. 그분은 마지막까지 자기 옷깃에 목이 졸렸군요.`],
    "칼라 폭 측정": `…그 칼라는 오늘 새벽, 제가 물려받기로 한 것이었습니다.`,
    "녹음 — 23:40 시중": `성민이가… 이 말을 들었다고요? 그날 밤 저한테는 아무 말도 안 했습니다. 아무 말도. 혼자 그걸 다 듣고, 혼자….`,
    "성민의 성경 속 사진": `작년 겨울에 둘이 몰래 다녀온 바다입니다. 하루 만에 돌아왔어요. 이번엔… 안 돌아오려고 했습니다. 그건 성민이 겁니다. 함부로 만지지 말아 주세요.`,
    "교주의 성경": `‘나로 말미암지 않고는 아버지께로 올 자가 없느니라.’ 그분은 이 구절을 자기 이야기로 읽으셨습니다. 진심으로요.`,
    "책상 위 액자": `사진 속 그 사람은 제가 기억하는 아버지가 아닙니다. 그런 날도 있었다는 게… 더 견디기 어렵습니다.`,
    "산기도원 이송 명단": `어머니가 가셨던 곳입니다. 그곳에 간 사람은 돌아오지 않습니다. 저 일곱 명도.`,
    "원진의 증언 — 정모의 외출": `원진이가 봤다면 맞겠죠. 두 시 전에 나간 건 저입니다.`,
    "원진의 증언 — 1호실 귀가 시각": `열두 시 삼 분이요? …성민이가 그렇게 늦게 왔다고요? 아닐 겁니다. 제가 지나갈 때 불이 켜져 있었어요.`,
    "원진의 증언 — 계단의 정모": `네. 금고로 가는 길이었습니다. 그래서 1호실 불을 본 겁니다.`,
    "원진의 증언 — 빈 침대": `제가 자고 있었다고요? …그랬나 봅니다. 성민이는 화장실에 갔겠죠.`,
    "성민의 패딩": `장작을 넣다 그런 거겠죠. 성민이는 매일 밤 난로 앞에 있었으니까요.`,
    "수련회 단체 패딩": `수련회 참가자들이 받은 옷입니다. 그분이 ‘내 아들의 형제들’이라고 이름 붙이셨죠.`,
    "기도실 수칙": `외투는 문밖에서 벗습니다. 저도 작년까지는 시중이었으니 압니다.`,
    "녹음 파일의 23:52": `그 시각 저는 별관 계단에 있었습니다.`,
    "매니저와의 대화": `태영이가 해 준 일입니다. 저와 성민이를 위해. 그 애에게도 쉬운 일이 아니었을 겁니다.`,
    "꺼진 장작 난로": `작년까지는 제가 넣었습니다. 성민이에게 시중을 넘기고부터는 그 애가요.`,
    "케이블 고정용 청테이프": [`테이프요? 모릅니다. 제가 그걸 왜요.`, `가져가지 않았습니다. 그 12분 동안 저는 금고에 다녀왔다고 말씀드렸습니다.`],
    "강단 아래 설교 테이프": `‘우는 것은 아버지를 의심하는 것입니다.’ 그래서 이 마을 사람들은 울지 않습니다. 저도… 칠 년 동안 한 번도 못 울었습니다.`,
    "파문 규정": `이 마을에서 파문은 이름을 잃는 겁니다. 살아 있는데 장례를 치르죠. …저는 그게 죽음보다 무섭습니다.`
  },

  인정: {},

  끼어들기: {
    "성민의 기도 수첩": `그건 성민이의 기도입니다. 남의 기도를 그렇게 읽지 마십시오.`,
    "원진의 통화 기록": [``, `원진아, 두 시 반쯤 어디 갔었어? 잠깐 깼는데 네 침대가 비어 있더라.`]
  },

  최종추궁: [
    [`당신은 아버지를 죽이고 싶었다고 했습니다.`, `네. 그 사람은 내게도, 신도들에게도 아버지라 불릴 자격이 없는 사람입니다. 그건 지금도 같습니다.`],
    [`23:47부터 12분, 당신은 녹음에서 사라졌습니다.`, `금고 앞에 있었습니다. 열한 시 오십사 분. 그 기록이 남아 있지 않습니까.`],
    [`마지막으로 묻겠습니다. 아버지를 죽였습니까?`, `죽이러 갔습니다. 로프를 들고. 그런데 문은 열리지 않았습니다. 아버지라고 불렀는데도.`]
  ],
  반박유형: {"시간": ["23:52에 저는 별관 계단에 있었습니다. 함 회장이 봤을 겁니다.", "제가 나갔다 온 건 두 시입니다. 연통이 막힌 건 그보다 두 시간 전이라고 하셨지요."], "소문": ["…형제님들 입이 가볍군요. 그건 들은 말이지 본 것이 아닙니다.", "아버지께서는 뒷말하는 혀를 가장 미워하셨습니다."], "증언": ["그 말은 사실입니다. 그런데 그 어디에도 제가 연통을 막았다는 얘기는 없습니다.", "원망한 건 숨기지 않겠습니다. 원망과 살인은 다릅니다."], "기타": ["어머니 일은… 제 일입니다. 아버지의 죽음과 엮지 마십시오.", "후계자가 아버지를 죽여서 얻는 게 뭡니까. 저는 잃을 것밖에 없었습니다."]},
  증거반박: {
    "금고 열림 기록": [`23:54, 교주 방 금고가 열렸습니다.`, `제 여권을 꺼낸 겁니다. 그 시각 저는 별관 2층에 있었습니다. 기도실과는 반대편입니다.`],
    "녹음 파일의 공백": [`연통이 막히던 그 무렵, 당신은 녹음에서 사라졌습니다.`, `그 시각 저는 별관 계단에 있었습니다. 원진이가 봤어요. 금고 기록도 23:54입니다. 뒷골목에서 별관 2층까지, 2분 만에 갈 수 있겠습니까.`],
    "정모 가방 속 로프": [`당신은 이 로프를 들고 기도실에 갔습니다.`, `네. 그런데 그분 목의 자국은 3.5cm라고 하더군요. 이건 1cm입니다.`],
    "녹음 — 01:58 아버지": [`01:58, 당신은 그 문 앞에 있었습니다.`, `있었죠. 문이 열리지 않는 소리까지 남아 있지 않습니까. 그때 그분은 이미 쓰러져 계셨고요.`],
    "목의 붉은 줄": [`교주의 목에 붉은 줄이 있었습니다.`, `칼라 자국입니다. 줄자로 재 보셨잖습니까.`],
    "면담 일지": [`당신은 ‘차라리 죽어 버리세요’라고 했습니다.`, `했습니다. 그분은 일산화탄소로 돌아가셨죠. 저는 연통 근처에도 가지 않았습니다.`],
    "케이블 고정용 청테이프": [`연통을 막은 것과 같은 테이프가 당신이 드나든 방에 있었습니다.`, `그 방엔 우빈이도 태영이도 있었습니다. 그리고 23:52, 저는 별관 계단에 있었고요.`]
  }
});

/* =====================================================================
   서우빈 대사 (woobin.js)
   말투: 밝고 쾌활하다. 농담도 잘한다. 그러나 어머니 이야기가 나오면 갑자기 조용하고 진지해진다.
   `백틱` 안의 글자만 고치면 됩니다. 증거 이름은 evidence.js의 n과 같아야 합니다.
   ===================================================================== */
인물({
  id: "woobin", 이름: "서우빈", 나이: 25, 이니셜: "서",
  역할: "찬양팀장",
  사진: "",

  관계: `찬양팀장 서우빈입니다! 열 살 때부터 성가대였어요. 아버지가 제 노래를 처음으로 칭찬해 주신 분이에요. 그때 사탕도 주셨는데, 하하. 아버지는 기도 중에 하늘로 부름 받으셨어요. 그러니까… 오늘은 축제예요. 그렇죠?`,
  알리바이: `기도회 반주하고, 끝나고 찬양팀실에서 태영이랑 특송 연습했어요! 녹음 다 돼 있어요. 그다음엔 소파에서 기절했죠.`,
  알리바이요약: `22:30~23:15 기도회 반주, 23:20~00:40 찬양팀실 녹음(태영과), 이후 찬양팀실. 05:05 사무실.`,

  지목1: `저요? 하하, 저 밤새 기타 치고 있었어요. 파일에 다 남아 있어요. 제 기타 실력까지 같이요.`,
  지목2: `…새벽에 음향실에 간 건 맞아요. 근데 저는 노래로 그 사람을 무너뜨리려고 했어요. 죽이려던 게 아니에요. 죽은 사람한텐 그 노래가 안 들리잖아요.`,
  오답엔딩: `우빈은 새벽 세 시, 음향실에서 05:12의 예약을 걸었다. 새벽예배 말씀 직전, 청년부 모두가 듣는 스피커로 가짜 기적의 리허설 녹음이 흘러나오도록. 그러나 05:10에 기도실 문이 열렸고, 그는 05:11에 전원을 내렸다. 차마 죽은 사람 앞에서 그 목소리를 틀 수는 없었다. 열 살 때 처음 노래를 칭찬받은 그 사람 앞에서. 그리고 열아홉 살 때, 엄마 병상 옆에서 그 노래를 쓰게 만든 사람 앞에서.`,

  모른다: [`음, 그건 잘 모르겠어요! 저는 음악밖에 몰라서요.`, `어… 모르겠는데요? 하하.`],
  아니다: [`제 거 아니에요!`],
  누가: [`글쎄요, 저는 찬양팀실 밖 일은 잘 몰라요.`, `모르겠어요. 그날 밤 기타만 붙잡고 있었거든요.`],
  잘모르는곳: `{장소} 일은 잘 몰라요. 저는 찬양팀실 지박령이라.`,
  안간곳: `그날 밤 {장소}엔 안 갔어요!`,
  내물건아님: `제 {물건} 아니에요.`,

  가면: {
    깨는증거: ["치유 사역 기록부", "이름 없는 성가대"],
    깨짐: `(우빈의 웃음이 얼굴에서 그대로 굳는다. 한참 뒤, 처음 듣는 낮은 목소리) …하하. 아니다. 안 웃을게요. 탐정님, 저 열 살 이후로 아버지라는 말 할 때마다 웃었어요. 안 웃으면 울 것 같아서.`,
    지목1: `저요? 하하, 제가 아버지를요? 저 밤새 아버지 특송 연습했어요. 파일에 다 남아 있어요. 아멘까지 같이요.`,
    대사: {
      "강단 아래 설교 테이프": `‘성도가 죽거든 울지 마십시오.’ 네! 그래서 오늘도 찬양할 거예요. 아버지가 제일 좋아하시던 곡으로요.`,
      "시신의 상태": `엎드려 계셨어요. 기도하다 잠드신 줄 알았어요. 그런데 얼굴이… 너무 붉었어요. (웃음이 사라졌다가 돌아온다) 저는 그 자리에서 찬양을 불렀어요. 아버지가 그렇게 가르치셨으니까요.`,
      "음원 사재기 정산서": `…이건 제가 볼 서류가 아닌 것 같아요. 아버지 일은 아버지가 아시겠죠! 하하.`,
      "기도회 녹음": `기도회요! 312장 「일어나 걸어라」로 시작했어요. 아버지 애창곡이에요. 회개할 사람이요? 저는 아니에요, 하하. 저는 매일 회개하니까.`
    }
  },


  증거답변: {
    "카펫 밑의 바닥 문": `바닥 문이요? 몰랐어요… 근데 찬양할 때 가끔 발밑이 울렸어요. 쿵, 쿵. 베이스 소리인 줄 알았는데. (웃음이 사라진다) …아니었구나.`,
    "지하 회개실": `…그래서 기도회 찬양을 그렇게 크게 하라고 했구나. 밑에서 나는 소리 안 들리게. (기타를 내려놓는다)`,
    "고해 테이프 상자": `2018년 9월… 엄마 얘기 했던 날이에요. 여기서. 녹음되고 있는 줄도 모르고.`,
    "벽으로 돌려진 사진들": `어… 저 아니에요! 저는 반주하느라 복도도 안 나갔어요.`,
    "이름 없는 성가대": `아… 그거 보셨구나. 원곡이에요. 엄마 병실에서 쓴 거. 원래 가사는 ‘일어나지 않아도 괜찮아요’였어요. 누워 있어도 괜찮다고. 아버지가 가사를 바꿨어요. 제목까지요. 「믿음으로 일어서라」. 그리고 엄마를 일으켜 세웠죠. 항암 끊게 하고. 어젯밤 기도회 직전에 원곡을 올렸어요. 이름 없이. 들키면 저도 산기도원이에요. 그래도… 엄마가 마지막으로 들은 노래는 이거였으면 해서요.`,
    "기도회 녹음": `312장 「일어나 걸어라」로 시작했어요. 아버지 애창곡이요. 다들 손뼉 치는데, 저는 반주하면서 제 노래 원래 가사를 속으로 불렀어요. ‘일어나지 않아도 괜찮아요.’ 회개할 사람이 저일 줄 알았어요. 이십 분 전에 원곡을 올렸거든요.`,
    "은지 어머니의 메시지": `은지… 태영이 병원 위문 공연 때 만난 애예요. 저도 거기 있었어요. 기타 쳤어요. 「믿음으로 일어서라」. …하하. 그 곡을요.`,
    "시중 보고 수첩": `‘1/03 서우빈 형제님 — 다른 가사로 노래함.’ …하하. 들었구나, 성민이. 찬양팀실 문 앞에서.`,
    "시신의 상태": `엎드려 계셨어요. 기도하다 잠드신 줄 알았어요. 그런데 얼굴이… 너무 붉었어요. (웃음이 사라진다) 저는 그 자리에서 기도를 했어요. 우는 대신에요. 여기선 그렇게 배워요.`,
    "‘치유의 시간’ 큐시트": [`아, 그거 다음 주일 본교 예배 순서예요. 진행표는 어느 교회나 있잖아요. 여백 글씨요? …낙서예요, 낙서.`, `(한참 말이 없다) 네. 연출이에요. 김 집사님은 원래 잘 걸으세요. 아버지가 ‘이제 일어나시면 돼요’ 하면 일어나요. 제 곡에 맞춰서. 「믿음으로 일어서라」. 원래는 제가 열아홉 살 때 엄마 병상 옆에서 쓴 「누워 있어도 괜찮아요」였어요. 아버지가 제목도 가사도 뒤집었죠. 엄마는 그 노래에 일어났다가, 다시 못 일어났어요. 그 곡이 지금 매주 헌금함 앞에서 가짜 기적에 쓰여요. …기적이 정말 있었으면, 엄마가 일어났겠죠.`],
    "치유 사역 기록부": `(웃음기가 완전히 사라진다) …윤○○ 권사. 우리 엄마예요. 위암 3기였어요. 아버지가 병원에 그만 다녀도 된다고 했어요. 안수로 나았다고. 엄마는 그 말을 믿고 항암을 끊었어요. 저는 그 간증 예배에서 반주를 했고요. 엄마가 웃으면서 일어나던 그날. 두 달 뒤에 돌아가셨어요. ‘믿음 부족’이래요. 그리고 그 간증 영상, 아직도 틀어요. 매주.`,
    "콘솔 로그인 기록": [`아, 잠이 안 와서 음향 점검 좀 했어요. 새벽예배 전에. 저 원래 좀 꼼꼼해요.`, `점검이 아니었어요. 그리고 다섯 시 십일 분은… 제가 전원을 내린 거예요.`],
    "예약 재생 설정": { 답: `…제가 걸었어요. 세 시쯤. 아버지가 새벽예배 말씀을 시작하기 직전에 그 리허설 녹음이 스피커로 나가게요. 청년부 애들 다 모인 데서. 주일에 본교에서 일어날 기적이 어떻게 만들어지는지 다들 듣게. 아버지를 죽이려던 게 아니에요. 그 가짜 기적을 죽이려던 거예요. 엄마를 죽인 그 기적을. 그런데 문을 열었더니 아버지가… 그래서 음향실로 뛰어가 전원을 내렸어요. 죽은 사람한테 그걸 들려줄 순 없었어요.`, 새증거: "우빈의 고백" },
    "녹음 파일의 23:52": `그 시간 저는 기타 치고 있었어요. 한 번도 안 끊겼잖아요. 틀린 코드까지 다 들리죠? 하하.`,
    "녹음 파일의 공백": `정모가요? 잠깐 나갔다 온다고 했어요. 어디 가는지는 안 물었어요. 나갈 때 문 옆 선반 쪽으로 갔던 것 같은데….`,
    "늘어난 넥타이": `태영이 무대 넥타이예요. …근데 왜 저렇게 늘어났지? 쟤 긴장하면 그거 쥐어뜯긴 하는데.`,
    "음원 사재기 정산서": `…태영이 1위 하던 날 찬양팀실에서 다 같이 울었어요. 아, 여기선 울면 안 되는데 그날은 다 울었어요. 그 눈물이 다 4억짜리였네요.`,
    "케이블 고정용 청테이프": `케이블 테이프예요! 문 옆에 두니까 누구나 집어 가요. 어젯밤에… 정모가 나갈 때 선반 쪽에 손을 뻗었던 것 같기도 하고요. 확실하진 않아요. 기타 치느라.`,
    "새벽예배 순서지": `다섯 시 십오 분, 아버지 말씀. 원래대로라면 그 직전에… 아, 아니에요. 아무것도요.`,
    "강단 아래 설교 테이프": `‘성도가 죽거든 울지 마십시오.’ …엄마 장례 때 이 테이프 틀었어요. 저는 반주했고요. 아무도 안 울었어요. 저도요. 그게 제일 후회돼요.`
  },

  인정: {
    "쥐약 영수증": `아, 제 거예요! 찬양팀실에 쥐가 나와서요. 악기장 뒤에 덫 놨어요. 보시면 알아요.`
  },

  끼어들기: {},

  최종추궁: [
    [`당신은 교주의 가짜 기적을 반주했습니다.`, `네. 매주요. 제 노래로. 엄마를 위해 쓴 노래로.`],
    [`새벽 세 시, 당신은 기도실 바로 앞 음향실에 있었습니다.`, `그리고 예약을 걸었어요. 노래를 틀려고. 연통은 그 반대편이에요.`],
    [`마지막으로 묻겠습니다. 교주를 죽였습니까?`, `아니요. 저는 그 사람이 아침에 모두 앞에서 부끄러워지길 바랐어요. 살아서. 엄마처럼 믿었던 사람들 앞에서.`]
  ],
  반박유형: {"시간": ["23:52에 저 찬양팀실에서 녹음 중이었어요. 파일에 제 기타 소리 다 들어 있어요.", "제 예약은 05:12예요. 그땐 그분 이미 돌아가셨잖아요."], "소문": ["그거 누가 한 말이에요? …다들 제가 조용하니까 만만한가 봐요.", "들은 얘기로는 노래도 못 만들어요. 증거를 주세요."], "증언": ["네, 그 말은 맞아요. 근데 그거랑 연통은 상관없어요.", "제가 숨긴 건 노래예요. 사람 목숨이 아니라."], "기타": ["곡을 뺏긴 건 맞아요. 근데 그 사람이 죽어도 곡은 안 돌아와요.", "그건 제 비밀이지, 살인 증거가 아니에요."]},
  증거반박: {
    "콘솔 로그인 기록": [`새벽 세 시, 당신은 음향실에 있었습니다.`, `있었어요. 그런데 아버지는 01:02에 이미 쓰러지셨어요. 녹음에 다 남아 있잖아요.`],
    "쥐약 영수증": [`당신은 쥐약을 샀습니다.`, `쥐약은 쥐덫에 그대로 있어요. 대추차에 파란 알갱이 하나라도 있었어요?`],
    "치유 사역 기록부": [`교주는 당신 어머니를 죽게 했습니다.`, `네. 그래서 저는 그 기적을 죽이려고 했어요. 23:52엔 기타 치고 있었어요. 녹음이 증명해요.`]
  }
});

/* =====================================================================
   함원진 대사 (wonjin.js)
   말투: 외향적이고 말이 많다. 남을 잘 의심하고 자꾸 다른 사람을 가리킨다.
         그러나 교주와 누나 이야기가 나오면 말이 짧아지고, 눈에 핏발이 설 만큼 경멸한다.
   `백틱` 안의 글자만 고치면 됩니다. 증거 이름은 evidence.js의 n과 같아야 합니다.
   ===================================================================== */
인물({
  id: "wonjin", 이름: "함원진", 나이: 24, 이니셜: "함",
  역할: "청년부 회장 · 장로의 아들",
  사진: "",

  관계: `저요? 함 장로님 아들이요! 태어날 때부터 여기 살았어요. 청년부 분위기 메이커 담당이고요. 아버지는요… 우리 집 모든 걸 정해 주시는 분이에요. 감사하죠. 기도 중에 하늘로 부름 받으셨으니까 슬퍼할 일 아니에요. 아멘!`,
  알리바이: `기도회 끝나고 복도에서 누나랑 통화했어요. 열두 시 반까지. 그 뒤로는 방에서 잤고요. 다른 사람들 동선이나 좀 보세요.`,
  알리바이요약: `22:30~23:15 기도회, 23:15~ 별관 1층 복도(23:35~00:25 통화), 이후 1호실. 04:30 기상(새벽예배 준비).`,

  지목1: `저요? 네, 그 인간 싫어했어요. 이제 숨길 것도 없네요. 근데 저 밤새 복도에서 통화했다니까요. 통화 기록 보세요. 차라리 정모 형한테 두 시에 어디 갔었는지 물어보시는 게 빠를걸요.`,
  지목2: `…칼 들고 나간 거, 맞아요. 그 인간 목에 꽂고 싶었어요. 근데 그 방엔 가지도 못했어요. 강민희 새 형제님이 세웠어요. 강민희 새 형제님이 증인이에요.`,
  오답엔딩: `원진은 새벽 두 시 반, 식칼을 들고 복도로 나섰다가 민희에게 붙잡혔다. 그날 밤 그는 누나와 50분을 통화했다. 대부분은 누나가 울었고, 마지막 말은 ‘너만은 거기서 나와’였다. 1월 20일, 산기도원으로 가는 차에는 이송 명단 4번이 그대로 올랐다. 살인 혐의로 함께 할 수 없게 된 동행자 칸의 이름만 바뀐 채.`,

  모른다: [`음, 그건 잘 모르겠는데요. 근데 그거 누구한테 물어보셨어요?`, `모르죠. 여기 사람들 다 뭔가 숨기는 거 아시죠?`],
  아니다: [`제 거 아니에요. 진짜로.`],
  누가: [`글쎄요… 저라면 정모 형이나 세림 씨부터 보겠어요.`, `몰라요. 근데 다들 수상하잖아요.`],
  잘모르는곳: `{장소}{은/는} 제가 잘 안 가는 데라서요.`,
  안간곳: `그날 밤 {장소}엔 안 갔어요. 맹세해요.`,
  내물건아님: `제 {물건} 아니에요.`,

  가면: {
    깨는증거: ["산기도원 동행 기록", "교주의 휴대폰"],
    깨짐: `(원진이 웃는 얼굴 그대로 굳는다. 목소리만 낮아진다) …아멘, 아멘. 지겹다, 진짜. 탐정님, 저 이 마을에서 제일 크게 아멘 하는 애예요. 제일 크게 해야 아무도 저를 안 봐요.`,
    지목1: `저요?! 와, 장로님 아들이 아버지를요? 저 밤새 복도에서 통화했다니까요. 차라리 정모 형한테 두 시에 어디 갔었는지 물어보시는 게 빠를걸요.`,
    대사: {
      "산기도원 이송 명단": `네, 4번이 제 누나예요. 동행자 칸에 제 이름 있죠. 제가 데려가요. 가족이 가족을 보내는 게 사랑이니까요. 누나가 회개하고 돌아오면… 좋겠어요. 아멘.`,
      "강단 아래 설교 테이프": `‘가족이 가족을 보내는 것, 그것이 사랑입니다.’ 이거 들으면서 컸어요. 수백 번 아멘 했어요. 앞으로도 할 거고요!`,
      "어머니의 산기도원 기록": `‘기도 중 소천.’ 기도하다 가셨으면… 복 받으신 거죠. 그렇게 배웠어요.`,
      "산기도원 회개 일지": `…(입을 다물었다가 억지로 웃는다) 사모님도 회개하셨으면 좋았을 텐데요. 그쵸?`,
      "기도회 녹음": `‘이 중 한 사람이 회개할 것이다!’ 와, 그때 소름 돋았어요. 아버지는 다 아세요. 진짜로요.`
    }
  },


  증거답변: {
    "벽 속의 쪽지": `(쪽지를 쥔 손이 떨린다) …들렸대요. 제 아멘이. 누나는 이 밑에서 그걸 듣고 있었대요. 저는 누나 들으라고 크게 한 게 아니었는데. 아무도 저를 안 보라고 크게 한 건데.`,
    "거꾸로 들리는 목소리": `(웃음기가 사라진다) 노래 끝날 때까지 나오지 마라… 그래서 기도회 찬양을 그렇게 크게 시켰구나.`,
    "고해 테이프 상자": `‘함지윤 — 12월 29일.’ …누나 목소리가 저 안에 있어요. 트럭에서 내린 그날 새벽. 듣고 싶은데, 듣기 싫어요.`,
    "카펫 밑의 바닥 문": `저 밑에… 누나가 있었어요. 12월 29일부터 사흘. 저는 그 사흘 밤, 위에서 제일 크게 찬양했어요.`,
    "지하 회개실": `누나가 여기 있었어요. 벽 저 자국 중에… (말을 잇지 못한다)`,
    "연통 받침의 반사 실밥": `와, 이거 우리 셋 거잖아요. 저 아니에요. 저 그때 복도에서 누나랑 통화 중이었다니까요. 통화 기록 보세요.`,
    "벽으로 돌려진 사진들": `몰라요. 저는 오후 내내 대예배당에 있었어요. …근데 아무도 다시 안 돌려놓네요. 저도 안 할 거고요.`,
    "녹음 — 04:45 마지막": { 답: `네 시 사십오 분… 저 그때 깨 있었어요. 예배 준비 때문에 네 시 반에 일어났거든요. 사십 분쯤 성민 형제님이 살금살금 나가더라고요. 오십오 분에 들어왔는데 탄 냄새가 났어요. 정모 형은 자고 있었고요. …그때 나간 게, 이거였어?`, 새증거: "원진의 증언 — 빈 침대", 알면: { "원진의 증언 — 빈 침대": `네 시 사십오 분이면… 성민 형제님 침대 비어 있던 그때예요. 사십 분에 나가서 오십오 분에 들어왔다니까요. 탄 냄새 나면서. …그때 나간 게, 그거였어?` } },
    "산기도원 동행 기록": `…준호 형. 청년부 선배요. 탈퇴하고 싶다고 했다가. 제가 데려갔어요. 차 안에서 형이 그러더라고요. ‘원진아, 너는 이러지 마.’ 석 달 뒤에 소천이래요. 저 그때 장례 예배에서 제일 크게 아멘 했어요. 그래서 누나도 저보고 데려오래요. 한 번 해 봤으니까. 잘하니까.`,
    "기도회 녹음": `회개할 사람이요? 누나 얘긴 줄 알았어요. 누나 데려가는 게 사흘 뒤니까. 그 말 끝나자마자 시중을 내보내길래, 아 오늘 밤에 누가 불려 가겠구나 했어요. 기도실로.`,
    "어머니의 입소 서약서": `형이… 서명했어요? (한참 말이 없다) 저랑 똑같네. 저도 다음 주에 누나 칸에 이름 적혀 있는데. 이 마을에선 다 이렇게 하나 봐요. 자기 손으로.`,
    "트럭 운행 쪽지": `12월 29일 함○○… (목소리가 갈라진다) 누나예요. 그 인간이 문자 보낸 다음 날 새벽. 누나가 나가려고 했었구나. 근데 내렸대요. 저 때문에. 동생 두고는 못 간다고.`,
    "시중 보고 수첩": `‘12월 28일 함지윤 — 아버지를 험담함.’ …그다음 주에 명단이 나왔어요. 안성민. 이거, 너야? 누나 이름 올린 게 너였어?`,
    "산기도원 이송 명단": [`네, 4번이 제 누나예요. 동행자 칸에 제 이름 있죠. 제가 데려가는 거예요. …이 마을에선 가족이 가족을 보내요. 그게 사랑이래요.`, `누나는 그 인간이 기도실로 부른 날 도망쳐 나왔어요. 그 얘기를 장로님들한테 했더니 그게 ‘음해’래요. 그래서 산기도원이에요. 회개할 때까지. 누나가요. 누나가 회개를 해요.`],
    "교주의 휴대폰": `(한참 화면을 노려본다) ‘너만 특별히 안수해 주마.’ …‘문은 잠그지 말고.’ 이런 걸 보내 놓고 저한테 누나를 데려오래요. 우리 아버지는 ‘아멘’이라고 답했고요. 탐정님, 저 이거 보니까 그 인간이 죽은 게 아깝지가 않네요. 하나도.`,
    "원진의 통화 기록": [{ 답: `순서요? 성민 형제님이 먼저, 정모 형이 바로 뒤에 들어왔어요. 자정쯤? 통화 중이라 시계는 안 봤고요. 아, 그리고 이건 꼭 말해야겠는데, 두 시 조금 전에 정모 형이 혼자 나갔어요. 이십 분 가까이 있다 들어왔고요. 뭐 들고 나갔는지는 못 봤는데… 수상하죠? 아, 누나가 ‘벌써 열두 시 삼 분이네’ 했을 때 성민 형제님이 들어왔어요. 그 전엔 1호실 비어 있었고요. 아, 열한 시 오십 분 좀 넘어서는 정모 형이 제 옆을 지나 2층으로 뛰어 올라갔어요. 금방 다시 내려와서 본관 쪽으로 나갔고요.`, 새증거: "원진의 증언 — 정모의 외출", 새증거2: ["원진의 증언 — 1호실 귀가 시각", "원진의 증언 — 계단의 정모"] }, { 답: `누나랑 오십 분. …아, 이 기록 보니까 확실해졌어요. 누나가 ‘벌써 열두 시 삼 분이네’ 했을 때 성민 형제님이 들어왔어요. 2분 뒤에 정모 형. 그 전엔 1호실 비어 있었어요. 불은 제가 켜 두고 나온 거고요. 아, 열한 시 오십 분 좀 넘어서는 정모 형이 제 옆을 지나 2층으로 뛰어 올라갔다가 금방 내려갔어요.`, 새증거: "원진의 증언 — 1호실 귀가 시각", 새증거2: ["원진의 증언 — 정모의 외출", "원진의 증언 — 계단의 정모"] }],
    "새벽예배 공지": { 답: `예배 준비 때문에 네 시 반에 일어났어요. 공지 올리려고 휴대폰 보고 있는데, 네 시 사십 분쯤 성민 형제님이 살금살금 나가더라고요. 오십오 분에 들어왔는데 탄 냄새가 났어요. 정모 형은 그때 자고 있었고요. 그땐 별일 아닌 줄 알았는데… 지금 생각하니까 좀 이상하네요?`, 새증거: "원진의 증언 — 빈 침대" },
    "녹음 파일의 공백": [`그 시간이요? 저 통화 중이라… 근데 정모 형이 그 시간에 없었어요? 와, 정모 형한테 물어보셔야겠네.`, { 답: `아, 그때 정모 형이 제 옆을 지나서 2층으로 뛰어 올라갔어요. 이삼 분 뒤에 다시 뛰어 내려왔고요. 손에 뭘 쥐고 있었는데, 여권 같은 거? 제가 ‘형 어디 가?’ 했는데 대답도 안 하더라고요.`, 새증거: "원진의 증언 — 계단의 정모", 알면: { "원진의 증언 — 계단의 정모": `말씀드렸잖아요. 그때 정모 형이 제 옆을 지나 2층으로 뛰어 올라갔다니까요. 금고 쪽으로.` } }],
    "금고 열림 기록": [`모르겠는데요. 근데 비밀번호 아는 사람이 몇이나 돼요? 정모 형이랑… 세림 씨?`, { 답: `열한 시 오십사 분이면 정모 형이 2층으로 뛰어 올라간 그때예요. 제 옆을 지나갔어요. 이삼 분 뒤에 뭘 쥐고 내려왔고요.`, 새증거: "원진의 증언 — 계단의 정모", 알면: { "원진의 증언 — 계단의 정모": `말씀드렸잖아요. 그때 정모 형이 제 옆을 지나 2층으로 뛰어 올라갔다니까요. 금고 쪽으로.` } }],
    "민희의 녹음기": `…강민희 새 형제님이 다 녹음했네요. 네. 그 칼, 제가 들고 있었어요. 강민희 새 형제님 아니었으면 저 지금 여기 이렇게 못 앉아 있었을 거예요.`,
    "수련회 단체 패딩": `제 건 옷걸이에 있어요. 밤새 거기 걸려 있었어요. 정모 형 것도요. …어, 근데 성민 형제님 건 왜 없지?`,
    "성민의 패딩": { 답: `…이거 성민 형제님 거잖아요. 소매가 녹았네. 잠깐, 그러고 보니 새벽에… 예배 준비 때문에 네 시 반에 일어났는데, 사십 분쯤 성민 형제님이 살금살금 나가더라고요. 오십오 분에 들어왔는데 탄 냄새가 났어요. 정모 형은 그때 자고 있었고. 이 냄새였구나.`, 새증거: "원진의 증언 — 빈 침대", 알면: { "원진의 증언 — 빈 침대": `…돌아왔을 때 났던 탄 냄새, 이거였구나. 성민 형제님, 진짜…?` } },
    "꾸려 둔 짐 두 개": `정모 형이랑 성민 형제님 거요. 뭔가 계획이 있는 것 같던데 안 물어봤어요. 알면 저도 말해야 하잖아요. 이 마을에선 아는 게 죄예요.`,
    "녹음 — 23:52 벽 너머": `그 시간엔 저 별관 복도였어요. 강민희 새 형제님이 시끄럽다고 문 열고 나왔었고요. 영어 목소리면… 앨런 형제님 아니에요? 그 사람 밤에 뒷문 쪽 자주 가던데.`,
    "기도실 시중 카트": `시중 카트는 성민 형제님 거예요. 다른 사람은 안 만져요. 만지면 혼나요. 근데 식당 문은 안 잠기니까, 누구든 만질 수는 있었겠네요?`,
    "어머니의 산기도원 기록": `‘기도 중 소천.’ …누나도 이렇게 될 뻔했어요. 아니, 될 거였어요.`,
    "산기도원 회개 일지": `‘아들을 데려와 창 너머로 보게 함.’ …이게 사람이 할 짓이에요? 정모 형, 이걸 겪었구나. 그래서 그 로프를….`,
    "강단 아래 설교 테이프": `‘가족이 가족을 보내는 것, 그것이 사랑입니다.’ 이거 들으면서 컸어요. 저도 아멘 했어요. 수백 번. …토 나와요.`,
    "정모 가방 속 로프": `로프? 와, 정모 형 이거 두 시에 들고 나간 거 아니에요? 저 형 나가는 거 봤다니까요.`
  },

  인정: {
    "칼꽂이의 식칼": `…제가 꺼냈어요. 두 시 반쯤. 누나를 데려가라는 인간이 내일 아침에도 살아 있으면 안 될 것 같았어요. 복도에서 강민희 새 형제님을 만났어요. 칼을 내려놓으라고 했어요. 그래서 내려놨어요. …그게 다예요.`
  },

  끼어들기: {
    "트럭 운행 쪽지": `관리자분. 12월 29일, 함○○. …우리 누나예요? 누나가 나가려고 했어요?`,
    "시중 보고 수첩": `…너였어? 누나 이름 위에 올린 게, 너였어? 안성민. 대답해.`,
    "꾸려 둔 짐 두 개": `형, 그 짐 뭐야? 어디 가려고 했던 거야? 나한텐 말도 안 하고.`,
    "정모 가방 속 로프": `형, 그 로프… 두 시에 그거 들고 나간 거야? 나 다 봤어.`
  },

  최종추궁: [
    [`당신은 누나를 산기도원에 데려가야 했습니다.`, `네. 그래서 그 인간이 없어지길 바랐어요. 그건 부정 안 해요. 지금도 바라요.`],
    [`02:20, 당신은 식칼을 들고 나갔습니다.`, `그리고 두 시 반에 복도에서 멈췄어요. 녹음 있잖아요.`],
    [`마지막으로 묻겠습니다. 교주를 죽였습니까?`, `…죽이고 싶었어요. 근데 누나가 너만은 거기서 나오라고 했어요. 살인자가 돼서 나오라는 말은 아니었을 거예요.`]
  ],
  반박유형: {"시간": ["23:52에 저 별관 복도에서 누나랑 통화 중이었어요. 민희 씨 녹음기에 제 목소리 있잖아요.", "두 시 반에 멈췄다고요. 몇 번을 말해요."], "소문": ["누가 그래요? 말 옮긴 사람 데려와 보세요.", "소문으로 사람을 몰아요? 이 동네가 원래 그래요. 누나도 그렇게 끌려갔어요."], "증언": ["그 말 맞아요. 그래서요? 거기 어디에 테이프가 있어요?", "인정할 건 인정해요. 근데 안 한 건 안 한 거예요."], "기타": ["그래요, 죽이고 싶었어요. 수백 번. 근데 연통 같은 건 몰라요. 저는 칼을 들었어요.", "누나 얘기 꺼내면 제가 무너질 줄 알았어요?"]},
  증거반박: {
    "벽 속의 쪽지": [`누나는 이 밑에 갇혀 있었습니다. 당신은 위에서 아멘을 외쳤고요.`, `…그래서 죽였을 거라고요? 그랬으면 칼로 했겠죠. 누나 들리게.`],
    "칼꽂이의 식칼": [`이 식칼을 꺼낸 건 당신입니다.`, `칼날 깨끗하잖아요. 그리고 그 인간은 칼에 죽지 않았어요. 아쉽게도.`],
    "산기도원 이송 명단": [`동행자 칸에 당신 이름이 있었습니다.`, `그래서 칼을 들었어요. 연통이 아니라. 그리고 그것도 끝까지 못 했어요.`],
    "교주의 휴대폰": [`교주가 당신 누나에게 한 짓을 당신은 알고 있었습니다.`, `알았죠. 그래서 칼을 들었고, 그래서 강민희 새 형제님이 세웠고요. 23:52엔 저 복도에서 누나랑 통화 중이었어요.`]
  }
});

/* =====================================================================
   강민희 대사 (minhee.js)
   말투: 1차에는 순진한 새신자인 척한다. 말끝을 흐리고, 감탄하고, 모르는 척한다.
         기자증이 드러난 뒤에는 날카로운 기자로 바뀐다. 짧고 정확하고, 탐정에게 되묻는다.
         (2차 대사 중 ‘알면: 기자증’이 붙은 것은 가방을 연 뒤에만 나온다)
   `백틱` 안의 글자만 고치면 됩니다. 증거 이름은 evidence.js의 n과 같아야 합니다.
   역할2는 가방 자물쇠(bag)가 열리면 바뀌는 신분입니다.
   ===================================================================== */
인물({
  id: "minhee", 이름: "강민희", 나이: 23, 이니셜: "강",
  역할: "새신자 · 입교 석 달",
  역할2: "주간 시선 사회부 기자",
  역할2조건: "bag",
  사진: "",

  관계: `아, 저는 석 달 전에 들어온 새신자예요. 아직 모르는 게 너무 많아서… 아버지 말씀은 처음 들었을 때 정말 따뜻했어요. 그래서 계속 나오게 됐어요. 아버지께서 부름을 받으셨다니… 저는 아직 슬퍼하지 않는 법을 못 배웠나 봐요. 죄송해요.`,
  알리바이: `기도회 끝나고 2호실에서 노트북으로 묵상 일기 썼어요. 한 시쯤 잤고요. 처음 온 수련회라 너무 떨렸어요.`,
  알리바이요약: `22:30~23:15 기도회, 23:15 세면, 23:30~00:30 2호실에서 노트북 작업, 이후 취침. 04:42 기상.`,

  지목1: `네? 저요? 저는 석 달 된 새신자예요… 아버지 얼굴도 몇 번 못 뵀어요. 제가 그럴 이유가 어디 있겠어요.`,
  지목2_잠금전: `저는 2호실에 있었어요. 노트북에 저장 기록도 남아 있을 거예요. 무서워요, 탐정님. 더 드릴 말씀이 없어요.`,
  지목2: `그만하죠. 기자 맞아요. 동생 때문에 들어온 것도. 그런데 탐정님, 계산해 보세요. 그 사람이 죽으면 제 기사는 끝나요. 법정도, 증언도, 진실도. 저한테 가장 필요했던 건 살아 있는 교주였어요.`,
  오답엔딩: `민희는 석 달 동안 신자의 얼굴로 기록을 남겼다. 동생은 이송 명단 3번이었다. 그는 그날 밤 칼을 든 원진을 멈춰 세웠고, 교주가 살아서 법정에 서길 바랐다. 하지만 그 바람은 이루어지지 않았다. 기사는 일주일 뒤에 나갔고, 그 주 가장 많이 읽힌 기사가 되었다. 하지만 정작 민희의 동생은 아직도 산에서 내려오지 못했다.`,

  모른다: [`어… 잘 모르겠어요. 저는 아직 새신자라서요.`, `그런 게 있어요? 처음 들어요.`],
  아니다: [`제 거 아니에요…`],
  누가: [`저는 잘 몰라요. 오래 계신 분들이 아시겠죠?`, `음… 모르겠어요.`],
  잘모르는곳: `{장소}{은/는} 아직 가 본 적이 없어요. 다 둘러보지도 못했어요.`,
  안간곳: `그날 밤 {장소}엔 안 갔어요.`,
  내물건아님: `제 {물건} 아니에요.`,

  가면: {
    찾으면: ["기자증"],
    대사: {
      "파문 규정": `살아 있는 사람 장례를… 아, 아니에요. 아버지 뜻이면 이유가 있겠죠. 저는 아직 배우는 중이라서요.`,
      "산기도원 이송 명단": `일곱 명이나… 다들 회개하고 돌아오시면 좋겠어요. 저도 기도할게요. (3번 이름 위에서 손가락이 아주 잠깐 멈춘다)`,
      "기도회 녹음": `처음 온 기도회라 너무 떨렸어요. 다들 목소리가 하나처럼 들려서… 은혜로웠어요.`
    }
  },


  증거답변: {
    "벽으로 돌려진 사진들": { 답: `누가 이런 일을… 무서워요.`, 알면: { "기자증": `찍어 뒀어요. 돌려진 액자들 앞을 신도들이 고개 숙이고 지나가는 거. 아무도 다시 안 돌려놓아요. 그게 이 마을의 진짜 표정이에요.` } },
    "기도회 녹음": `녹음기 켜 놨어요. 여덟 명이 같은 박자로 아멘. 저도 했어요. 들킬까 봐 제일 크게. 그 순간엔 제가 기자인지 신도인지 저도 헷갈렸어요. 석 달이면 그렇게 돼요.`,
    "집회 날의 남매 사진": `…제가 데려갔어요. 2024년 가을. 문화선교 취재 건이었어요. 민서가 태영 씨 팬이라고 따라오고 싶대서 VIP 목걸이까지 구해 줬어요. 그다음 달에 민서가 혼자 다시 갔어요. 그다음 달에도. 기사 때문에 들어온 거 아니에요. 제가 데려다 놓은 곳에서 동생을 데리고 나오려고 들어온 거예요. 이건 기사에 안 써요. 못 써요.`,
    "익명 제보 메일": { 답: `메일이요? 저는… 그런 건 잘 몰라요.`, 알면: { "기자증": `LA발 익명 제보. 그쪽이었군요. 데스크로 온 명단 원본 덕분에 동생 이름을 확인했어요. 고마워요, 앨런 형제님. 진심으로.` } },
    "시중 보고 수첩": { 답: `…저도 있네요. ‘기도 시간에 눈을 뜨고 사람들을 봄.’`, 알면: { "기자증": `‘12/05 강민희 — 기도 시간에 눈을 뜨고 사람들을 봄.’ 들켰었네요. 석 달 동안 제일 무서웠던 게 교주가 아니었어요. 저 조용한 시중이었어요.` } },
    "강단 아래 설교 테이프": [`…‘울지 마십시오.’ 그래서 오늘 아무도 안 울었군요. 저도… 울면 안 되는 거죠?`, { 답: `이 테이프, 수련회 때마다 트는 거래요. 아멘 소리가 정말 크죠.`, 알면: { "기자증": `녹취해 뒀어요. ‘가족이 가족을 보내는 것이 사랑입니다.’ 제 기사 첫 문장이에요. 이 한 줄이 이 마을 전부를 설명하니까.` } }],
    "파문 규정": [`살아 있는 사람 장례를 치른다고요? …여기 사람들은 이게 무섭지 않나 봐요.`, { 답: `이런 규칙도 있었네요… 저는 몰랐어요.`, 알면: { "기자증": `제 동생이 산기도원에서 버티면 다음은 이거예요. 파문. 그럼 우리 가족은 동생을 영영 못 찾아요. 명부에 이름이 없으니까. 실종 신고도 못 해요.` } }],
    "교주의 휴대폰": [`…이건 제가 볼 자격이 없는 것 같아요.`, { 답: `이런 걸… 아버지가요? 믿기지 않아요.`, 알면: { "기자증": `이게 기사예요. 석 달 동안 찾던 거. 발신 시각, 수신자, 장로의 ‘아멘’까지. …하필 그 사람이 죽은 다음에 찾았네요. 사본 하나 주세요. 진지하게요.` } }],
    "새신자 등록카드": [`네, 프리랜서예요. 글 쓰는 일이요. 가족을… 찾고 싶어서 왔어요. 이 교회에 먼저 온 가족이 있거든요.`, { 답: `가족을 찾으러 왔다고 썼어요. 그건 진짜예요.`, 알면: { "기자증": `글씨가 너무 반듯하죠? 기자는 거짓말을 쓸 때 글씨가 반듯해져요. 근데 ‘가족을 찾고 싶어서’, 그건 진짜였어요.` } }],
    "민희의 노트북": [`묵상 일기요. 보여 드릴 순 없어요… 기도는 사적인 거잖아요.`, { 답: `묵상 일기라니까요. 저장 기록 보시면 계속 쓰고 있었던 거 아실 거예요.`, 알면: { "기자증": `기사예요. 이 교단의 3년. 그날 밤 열두 시 반까지 썼어요. 1분 간격 자동 저장. 제 알리바이로는 그걸로 충분하죠.` } }],
    "기자증": `(표정이 바뀐다) 네. 주간 시선 사회부 강민희. 석 달 동안 여기서 신자로 살았어요. 신분을 밝혔으면 하루도 못 버텼을 거예요. 자, 이제 제대로 얘기하죠.`,
    "취재수첩": `3번 강민서. 제 동생이에요. 작년 여름 입교, 11월부터 연락 두절. 엄마한테 몰래 온 문자 한 통이 마지막이었어요. ‘오빠 나 여기서 나가고 싶어.’ 그게 ‘가족에게 몰래 연락’한 죄래요. 같은 곳에서 7년 전 교주의 아내가 ‘기도 중 소천’. 보도로는 늦어요. 그래서 그날 밤 끝내려고 했어요. 기사를요. 오해하지 마세요.`,
    "민희의 녹음기": `다 들으셨죠. 원진 형제님을 세운 건 저예요. 동생 때문에 칼 생각을 한 사람이 원진 형제님만은 아니었을 거예요. 저도 생각은 했으니까. 다만 저는 녹음기를 켰죠.`,
    "산기도원 이송 명단": [`…일곱 명이나 되네요. ‘가족에게 몰래 연락.’ 그게… 죄예요?`, { 답: `이 명단… 보고 있으면 숨이 막혀요.`, 알면: { "기자증": `3번이 제 동생이에요. 강민서. 등록카드에 가족을 찾으러 왔다고 썼죠. 거짓말은 아니었어요. 일곱 명 전원 사유 칸 보세요. 이게 죄면, 이 마을 사람 전부가 산에 가야 해요.` } }],
    "어머니의 산기도원 기록": [`‘기도 중 소천.’ …이런 기록이 있었네요.`, { 답: `돌아가신 분이… 교주님의 사모님이셨어요?`, 알면: { "기자증": `제가 찾던 기록이에요. 검안 없음. 같은 산, 같은 방식. 제 동생이 다음 줄이에요.` } }],
    "녹음 — 23:52 벽 너머": `그 시각엔 2호실이었어요. 23:50에 복도에 대고 원진 형제님한테 조용히 해 달라고 했어요. 녹음돼 있어요.`,
    "비자금 장부 사본": [`이게 다 숫자예요? 저는 숫자 보면 머리 아파요.`, { 답: `어려운 숫자들이네요.`, 알면: { "기자증": `사본이라도 저 주시면 안 돼요? 농담 반이에요. 3년 치 집행인 이름이 전부 한 사람이라는 거, 그게 제일 위험한 신호거든요. 꼬리 자르기.` } }]
  },

  인정: {
  },

  끼어들기: {
    "산기도원 이송 명단": { 답: `…동행자가 가족이라니.`, 알면: { "기자증": `동행자가 가족이에요. 탐정님, 이 칸이 이 마을의 핵심이에요. 가족이 가족을 보내면 아무도 신고하지 않으니까.` } }
  },

  최종추궁: [
    [`당신은 신분을 숨기고 잠입했습니다.`, `기자니까요. 숨겨야 들어올 수 있었어요. 그게 불법이면 기사 나간 다음에 처벌받을게요.`],
    [`당신 동생이 이송 명단에 있었습니다.`, `그래서 그 사람이 살아 있어야 했어요. 법정에서 대답하게. 죽은 사람은 대답을 안 하잖아요.`],
    [`마지막으로 묻겠습니다. 교주를 죽였습니까?`, `아니요. 저는 기록했어요. 그게 제가 할 수 있는 전부였고, 그게 제일 오래 남는 거예요.`]
  ],
  반박유형: {"시간": ["23:52에 전 2호실에 있었어요. 녹음기가 켜져 있었고요. 제 기침 소리까지 들어가 있을걸요.", "기자는 시간을 기록하는 사람이에요. 제 밤은 분 단위로 다 남아 있어요."], "소문": ["취재원이 누구죠? 확인 안 된 말은 기사로 못 써요. 추리도 마찬가지고요.", "그런 귀띔은 저도 하루에 열 개씩 들어요."], "증언": ["그 증언, 저를 가리키진 않네요. 다시 읽어 보세요.", "위장 잠입한 건 맞아요. 그건 취재지 범죄가 아니에요."], "기타": ["동생 일로 그 사람을 미워한 건 맞아요. 그래서 기사로 끝내려 했어요. 죽으면 기사도 못 써요.", "그건 제 취재 자료예요. 살인 도구가 아니고."]},
  증거반박: {
    "취재수첩": [`당신에게는 교주를 죽일 이유가 있었습니다.`, `23:30부터 00:30까지 노트북은 1분마다 저장됐어요. 23:50엔 녹음기에 제 목소리도 남아 있고요. 그 시각 저는 2호실에 있었어요. 확인해 보세요.`],
    "기자증": [`당신은 기자였습니다.`, `기자는 사람을 죽이지 않아요. 기록하죠. 그게 더 오래 가니까요.`]
  }
});

/* =====================================================================
   송형준 대사 (hyungjun.js)
   말투: 퉁명스러운 비신자. 말이 짧고 툭툭 던진다. 교주를 ‘그 인간’이라 부르고 신자들을 비꼰다.
         아버지와 어머니 이야기에서만 목소리가 낮아진다.
   `백틱` 안의 글자만 고치면 됩니다. 증거 이름은 evidence.js의 n과 같아야 합니다.
   ===================================================================== */
인물({
  id: "hyungjun", 이름: "송형준", 나이: 23, 이니셜: "송",
  역할: "수련원 관리인 · 비신자",
  사진: "",

  관계: `관리인이요. 오 년 됐고. 신자 아닙니다. 아버지라고도 안 불러요. 그 인간이 내 아버지는 아니니까. 이 마을에서 신자 아닌 건… 이제 우리 엄마랑 나뿐이에요.`,
  알리바이: `열 시에 소각로 태우고 걸쇠 걸었어요. 열한 시부턴 보일러실. 그다음 숙직실에서 잤고요. 밤에 본관 뒤쪽엔 한 번도 안 나갔어요. 끝이요.`,
  알리바이요약: `22:00 소각·걸쇠, 22:10~23:00 창고 장작 정리(기도회 불참), 23:00~00:20 보일러실, 이후 아침까지 숙직실. 밤에 본관 뒤쪽엔 나가지 않았다고 말함.`,

  지목1: `신자 아니라서 나부터 보는 거예요? 맨날 이래요. …보일러실에 있었다니까요.`,
  지목2: `쌀포대 들고 간 거, 맞아요. 세 시에. 근데 이미 막혀 있었어요. 내가 연통 앞에 섰을 때 그 인간은 벌써 죽어 가고 있었다고요. 누가 나보다 먼저 했어요.`,
  오답엔딩: `형준은 새벽 세 시, 쌀포대를 들고 연통 앞에 섰다. 연통은 이미 막혀 있었다. 그는 두려움에 그대로 도망쳤고, 아무에게도 알리지 않았다. 그날 아침 17번지에서는 철거 대신 교주의 장례 준비가 시작됐다. 형준의 어머니는 지붕에 오르지 않아도 됐다. 형준은 그 소식을 경찰서에서 들었다.`,

  모른다: [`몰라요.`, `난 시키는 일만 해요.`, `그런 건 신자들한테 물어보세요.`],
  아니다: [`내 거 아니에요.`],
  누가: [`모르죠.`, `신자들 일은 신자들한테 물어보세요.`],
  잘모르는곳: `{장소}? 거긴 내 구역 아니에요.`,
  안간곳: `그날 밤 {장소}엔 안 갔어요.`,
  내물건아님: `내 {물건} 아니에요.`,


  증거답변: {
    "거꾸로 들리는 목소리": `…그 인간, 사모님을 어디다 가뒀는지 이 마을 사람은 다 알았을걸. 다들 노래만 크게 불렀지.`,
    "카펫 밑의 바닥 문": `그 문이요? 작년 가을에 그 인간이 자물쇠 바꾸라고 해서 바꾼 게 마지막이에요. 그 뒤로 연 걸 못 봤어요.`,
    "지하 회개실": `쇠고리는 내가 박았어요. 뭐에 쓰는지 알면서. …그거 하나는 평생 안 지워질 거예요.`,
    "계단의 먼지": `봐요. 아무도 안 내려갔다니까. 그 문은 몇 달째 그대로예요.`,
    "연통 재현 측정": `…이렇게 빨리 차는 줄 몰랐어요. 경고문까지 붙여 놓고도. (문 쪽을 본다) 괜찮아요? 얼굴이 하얘요.`,
    "녹음 — 04:45 마지막": `네 시 사십오 분이면 난 숙직실에서 아침 가동 준비했어요. 세 시엔 분명 막혀 있었어. 그 사이에 누가 뜯어 간 거지. 내가 아니라.`,
    "트럭 운행 쪽지": `…그거 어디서 찾았어요. (한숨) 장작 배달 간다고 하고 읍내까지 태워 줘요. 나가고 싶다는 사람. 일 년에 몇 명. 그 인간은 몰랐어요. 알았으면 나도 산기도원이었겠지. 12월 29일 그 사람은… 함 장로네 딸이요. 새벽에 차에 탔다가 내렸어요. ‘동생 두고는 못 가요.’ 그러더라고.`,
    "기도회 녹음": `난 안 갔어요. 창고에서 장작 쪼갰어요. 거기까지 아멘 소리가 들려요. 여덟 명이 한 사람처럼. …그 소리 들으면 우리 아버지 장례 날 생각나요. 그날도 다들 저렇게 아멘 했어요.`,
    "시중 보고 수첩": `…성민 씨는 진짜였네. 다들 믿는 척하는 줄 알았는데. 그 사람 하나는 진짜로 믿었어요. 그래서 다 써 바친 거고. 그게 제일 무섭네.`,
    "강단 아래 설교 테이프": `(한참 듣다가 끈다) 그 테이프, 우리 아버지 장례 날에도 마을에 틀었어요. 확성기로. 아무도 안 울더라고. …엄마랑 나만 울었어요.`,
    "파문 규정": `신자 아닌 사람한텐 해당 없는 얘기네. 우리 같은 사람은 파문할 것도 없이 그냥 밀어 버리니까.`,
    "5년 전 철거 지시서": `(종이를 오래 본다) …‘지붕째 밀어라.’ 실족이랬어요. 경찰도. 신문도. 근데 이 인간은 전날 벌써 이렇게 써 놨네. (목소리가 낮아진다) 오늘 아침엔 우리 엄마 차례였어요. 같은 식으로.`,
    "난로 옆 경고문": [`내가 붙였어요. 그 난로, 연통 하나로 숨 쉬어요. 막히면 끝. 관리인이면 다 알아요.`, `…알았죠. 그러니까 붙였죠.`],
    "녹음 — 03:02 벽 밖": { 답: `…나예요. 쌀포대 들고 갔어요. 연통 막으려고. 근데 이미 막혀 있었어요. 검정 비닐 씌우고 파란 테이프로 칭칭. 숨이 턱 막히더라고. 누가 나랑 똑같은 생각을 했다는 게. 그대로 도망쳤어요.`, 새증거: "형준의 증언 — 03:02", 알면: { "형준의 증언 — 03:02": `이미 다 말했잖아요. 세 시에 갔을 땐 벌써 막혀 있었다고. 검정 비닐, 파란 테이프. 몇 번을 말해야 돼요.` } },
    "연통 끝의 테이프 자국": { 답: `…세 시에 내가 왔을 땐 이미 막혀 있었어요. 검정 비닐에 파란 테이프. 손도 안 댔어요. 도망쳤어요.`, 새증거: "형준의 증언 — 03:02", 알면: { "형준의 증언 — 03:02": `이미 다 말했잖아요. 세 시에 갔을 땐 벌써 막혀 있었다고. 검정 비닐, 파란 테이프. 몇 번을 말해야 돼요.` } },
    "풀린 뒷문 걸쇠": `열 시에 분명히 걸었어요. 그거 안에서만 풀려요. 누가 안에서 풀고 나간 거지, 나 말고.`,
    "쌀포대와 철사": [`창고 정리용이에요. 연통 지름? …보수하려고 재 둔 거고.`, `새것 그대로잖아요. 안 썼어요. 쓸 필요가 없었으니까.`],
    "철거 집행 공문": `우리 집이요. 오늘 아침에 헐려요. 엄마는 아직 그 안에 있고.`,
    "보일러 제어판 기록": { 답: `보일러실에 계속 있었다니까요. 버너가 자꾸 꺼져서. 상세 기록 보세요.`, 알면: { "형준의 증언 — 03:02": `열한 시 오십 분엔 진짜 보일러실이었어요. 못 믿겠으면 상세 기록 보세요. 4분마다 꺼진 버너, 내가 다시 켰으니까.`, "쌀포대와 철사": `쌀포대 봤으니까 그렇게 묻는 거죠. 연통 지름까지 재 둔 사람이 14분 비었으니까. …아니에요. 그 14분 동안 보일러실에서 버너 세 번 다시 켰어요. 상세 기록에 다 있어요.` } },
    "제어판 상세 기록": `봤죠? 4분마다 꺼졌어요. 그때마다 내가 다시 켰고. 그 버튼은 보일러실 안에만 있어요. 열쇠는 나만 있고.`,
    "교단 전화 통화 기록": { 답: `아, 그 전화. 내 면담 중에 왔어요. 그 인간이 받으면서 ‘박 실장? 그래, 다섯 시 반이라고’ 그러더라고. 그때 반쯤 열린 문밖에 성민 씨가 다과 쟁반 들고 서 있었어요. 나랑 눈 마주치니까 쟁반도 안 내려놓고 돌아갔어요. 이상하다 했지.`, 새증거: "형준의 증언 — 21:35 문밖" },
    "면담 일지": [`내 면담 중에 전화 와서 잠깐 끊겼어요. 다과는 그때 들어오다 말았고.`, { 답: `내 면담 때 그 인간이 전화 받았어요. ‘박 실장? 그래, 다섯 시 반이라고.’ 문밖엔 성민 씨가 다과 들고 서 있었고. 다 들었을 거예요. 쟁반도 안 내려놓고 돌아갔으니까.`, 새증거: "형준의 증언 — 21:35 문밖" }],
    "관리인 점퍼": `내 거요. 밤새 입었어요. 반사띠 같은 거 없어요. 그런 건 신자들 옷에나 달려 있지.`,
    "소각로의 타다 남은 비닐": `내가 태운 건 열 시예요. 그 위에 있는 건 내 거 아니고. 내 테이프는 노란색이에요.`,
    "장작 일지": `성민 씨가 매일 와서 여섯 개씩 가져가요. 시간 한 번 안 틀려요. 그 집은 다 그래요. 시계처럼.`,
    "수련회 단체 패딩": `수련회 애들 옷이요. 우빈이 태영이까지 다 받았던데. 난 그런 거 줘도 안 입어요.`
  },

  인정: {
    "벽으로 돌려진 사진들": `나요. 그 얼굴이 복도에서 나를 보는 게 싫어서. 죽은 사람이 아직도 쳐다보잖아요. …웃긴 건, 신자들이 아무도 다시 안 돌려놓는다는 거예요. 다들 그 앞을 그냥 지나가요. 고개 숙이고.`
  },

  끼어들기: {
    "땅콩버터 병": `앨런 씨요. 밤에 뒷문 계단 쪽 기웃거리는 거 몇 번 봤어요. 담배 냄새 풍기면서.`
  },

  최종추궁: [
    [`오늘 아침, 당신 어머니의 집이 헐릴 예정이었습니다.`, `네. 그 인간이 살아 있으면.`],
    [`당신은 연통 지름까지 재 두었습니다.`, `재 뒀죠. 그리고 세 시에 갔을 땐 이미 남이 막아 놨고.`],
    [`마지막으로 묻겠습니다. 교주를 죽였습니까?`, `…죽이러 갔어요. 늦었어요. 누가 나보다 세 시간 먼저 했어요. 그게 억울하냐고 물으면… 모르겠네.`]
  ],
  반박유형: {"시간": ["23:51에 저 보일러실에서 버너 다시 켰어요. 제어판에 다 찍혀요.", "세 시에 갔을 땐 이미 막혀 있었다니까요. 제 쌀포대는 안 썼어요. 끝이요."], "소문": ["아, 누가 그래요… 여기선 무슨 일만 나면 다 관리인 탓이에요.", "귀띔이요? 그런 걸로 잡으면 저 백 번은 잡혀 갔어요."], "증언": ["그거 맞아요. 근데 그게 제가 했다는 건 아니잖아요.", "숨긴 거 있어요, 인정해요. 근데 사람은 안 죽였어요."], "기타": ["그 인간 미웠죠. 근데 그 연통 매일 청소하던 게 저예요. …아, 그러니까 더 의심하겠네.", "그건 제 일이랑 관련된 거예요. 살인이랑은 아니고요."]},
  증거반박: {
    "연통 끝의 테이프 자국": [`연통 끝을 누가 막았습니다. 뒷골목은 당신 구역입니다.`, `파란 거잖아요. 창고 테이프는 노래요. 저 노란 거밖에 안 써요.`],
    "쌀포대와 철사": [`당신은 연통을 막을 준비를 했습니다.`, `새것 그대로잖아요. 연통 막은 건 검정 비닐이랑 파란 테이프예요.`],
    "보일러 제어판 기록": [`23:44부터 23:58까지, 14분이 비어 있습니다.`, `상세 기록 보세요. 23:47, 51, 55. 버너 다시 켜는 건 보일러실 안에서만 돼요.`],
    "녹음 — 03:02 벽 밖": [`03:02, 당신은 연통 앞에 있었습니다.`, `있었어요. 이미 막혀 있었다고요. 그 인간은 그때 벌써 죽어 가고 있었고.`],
    "난로 옆 경고문": [`당신은 연통이 막히면 사람이 죽는다는 걸 알았습니다.`, `알았죠. 그래서 써 붙였어요. 매일 밤 그 앞에서 장작 넣는 사람도 매일 읽었을 거고.`]
  }
});

/* =====================================================================
   김태영 대사 (taeyoung.js)
   말투: 연예인답게 방어적이고 날이 서 있다. 사진·기사·이미지를 먼저 신경 쓴다.
         팬레터와 가짜 1위 이야기에서만 벽이 무너진다.
   `백틱` 안의 글자만 고치면 됩니다. 증거 이름은 evidence.js의 n과 같아야 합니다.
   ===================================================================== */
인물({
  id: "taeyoung", 이름: "김태영", 나이: 22, 이니셜: "김",
  역할: "찬양 가수 · 문화선교부 소속",
  사진: "",

  관계: `김태영이요. 아시잖아요, 다들 아는데. 교단이 키운 가수예요. 데뷔도, 1위도, 다 아버지 은혜고요. 아버지는 하늘로 부름 받으셨고… 저는 아버지께 받은 노래로 보내 드릴 거예요. 그 말 그대로 써 주세요. 기사 나가면.`,
  알리바이: `기도회 끝나고 우빈 형제님이랑 찬양팀실에서 연습했어요. 그대로 소파에서 잤고요. 기도실 쪽엔 간 적 없어요. 이거 기사에 나가는 거 아니죠?`,
  알리바이요약: `22:30~23:15 기도회, 23:20~00:40 찬양팀실(우빈과 녹음), 이후 아침까지 찬양팀실 소파. 기도실 쪽엔 간 적 없다고 말함.`,

  지목1: `저요? 하… 저 밤새 녹음했다니까요. 파일 들어 보세요. 그리고 이런 거 함부로 말하지 마세요. 한마디가 기사 제목 돼요.`,
  지목2: `…넥타이 들고 간 건 맞아요. 됐어요? 근데 그 문은 안 열렸어요. 그리고 저보다 먼저 거기 있던 사람은 세림 씨예요. 그건 왜 안 물어보세요?`,
  오답엔딩: `태영은 01:36, 넥타이를 쥐고 기도실 문 앞에 섰다가 세림이 뛰쳐나오는 것을 봤다. 그는 잠긴 문고리를 두 번 당기고 돌아섰다. ‘못 했다.’ 그날 아침 태영은 서명하지 않은 계약서를 두고 다섯 시 반 밴에 혼자 올랐다. 정모와 성민이 함께할 이유는 이미 사라졌다. 태영의 가방 안주머니에는 소아병동에서 온 편지가 들어 있었다. 오빠도 늘 행복해 주세요.`,

  모른다: [`몰라요.`, `그걸 제가 어떻게 알아요. 저 노래하는 사람이에요.`, `그런 질문은 회사 통해서 해 주세요.`],
  아니다: [`제 거 아니에요. 사진 찍지 마세요.`],
  누가: [`모르겠어요. 저한테 묻지 마세요.`, `저 말고 다른 사람한테 물어보세요.`],
  잘모르는곳: `{장소} 일은 몰라요. 제가 거기 갈 일이 뭐가 있어요.`,
  안간곳: `그날 밤 {장소}엔 안 갔어요. 확실해요.`,
  내물건아님: `제 {물건} 아니에요. 괜히 엮지 마세요.`,

  가면: {
    깨는증거: ["음원 사재기 정산서", "태영 가방 속 팬레터"],
    깨짐: `(태영이 종이를 내려다보다 픽 웃는다. 날이 선 목소리가 꺾인다) …은혜는 무슨. 아버지요? 그 사람을 아버지라고 부를 때마다 계약서 조항 읽는 기분이었어요. 은혜 아니고 채무요.`,
    지목1: `저요? 하… 아버지 덕에 1위까지 한 사람이 왜요. 밤새 아버지 특송 녹음했다니까요. 이런 거 함부로 말하지 마세요. 한마디가 기사 제목 돼요.`,
    대사: {
      "데뷔 포스터": `2020년 4월 14일. 아버지가 무대에 손을 얹고 기도해 주신 날이에요. 그 은혜는 평생 못 잊죠.`,
      "기도회 녹음": `기도회 있었죠. 아버지 말씀 듣고 다 같이 아멘. 끝. 그 이상은 회사 통해서 물어보세요.`
    }
  },


  증거답변: {
    "고해 테이프 상자": `2020년 4월 14일. 데뷔 날. 계약서에 서명하기 전에 고해부터 하라더라고요. 그게 이거였네.`,
    "벽으로 돌려진 사진들": `몰라요. 저 오후 내내 대예배당에 있었어요.`,
    "은지 어머니의 메시지": `…은지예요. 편지 쓴 애. 지난달에 갔어요. 마지막까지 제 노래 틀어 달라고 했대요. 3,200개짜리 그 1위 곡을. 답장 쓰다가 못 보냈어요. ‘죄송합니다, 그 1위는.’ 그다음을 못 쓰겠더라고요. 그 애는 진짜였는데. 그래서 계약서에 서명을 못 했어요. 서명하면 그 노래가 끝까지 가짜로 남으니까.`,
    "기도회 녹음": `‘이 중 한 사람이 회개할 것이다.’ 그 말 듣는데 저인 줄 알았어요. 서명 안 한 계약서가 가방에 있었으니까. 근데 둘러보니까 다들 고개를 숙이고 있더라고요. 여덟 명이 다. 웃기죠. 다들 자기 얘긴 줄 알았던 거예요.`,
    "이름 없는 성가대": `우빈 형제님 원곡이요? …‘일어나지 않아도 괜찮아요.’ 이게 원래 가사였구나. 우리가 매주 부른 건 그 반대였네.`,
    "집회 날의 남매 사진": `2024년 가을 집회요? 제 무대였어요. 맨 앞줄에 VIP 목걸이… (얼굴이 굳는다) 이 애, 제 팬이었어요? 제가 무대에서 ‘여러분도 아버지 품으로 오세요’ 했던 그날이에요.`,
    "복구된 메모 조각": { 답: `…지웠어요. 그래요. 남의 휴대폰을… 하. 한 시 반에 기도실 앞에 갔어요. 그런데 문이 열리더니 세림 씨가 나왔어요. 뒷걸음질로. 열쇠로 문 잠그고 도망갔어요. 그래서 아무것도 못 하고 왔어요. 됐죠?`, 새증거: "태영의 증언 — 01:36", 확정: ["복구된 메모 조각"] },
    "늘어난 넥타이": [`무대 올라가기 전에 긴장하면 그렇게 쥐어요. 버릇이에요. 그게 무슨 문제예요?`, { 답: `버릇이라니까요. 몇 번을 말해요.`, 알면: { "01:40의 메모": `…메모까지 보셨네요. 네. 기도실 문 앞에서 그걸 양손에 감고 오래 서 있었어요. 그래서 늘어난 거예요. 이제 만족하세요?` } }],
    "녹음 — 01:38 문고리": [`몰라요. 저는 찬양팀실에서 자고 있었어요.`, { 답: `몰라요. 자고 있었다니까요.`, 알면: { "복구된 메모 조각": { 답: `…메모까지 복구하셨네요. 저예요. 세림 씨가 나가고 2분 뒤에 그 문고리 두 번 당겼어요. 잠겨 있었어요.`, 확정: ["녹음 — 01:38 문고리"] }, "01:40의 메모": { 답: `…메모 보셨으면 아시잖아요. 저예요. 세림 씨가 나가고 2분 뒤에 그 문고리 두 번 당겼어요. 잠겨 있었어요. 그 메모에 쓴 ‘못 했다’가 그거예요.`, 확정: ["녹음 — 01:38 문고리", "01:40의 메모"] }, "태영의 증언 — 01:36": { 답: `…저예요. 세림 씨 나가고 나서 문고리 당겼어요. 잠겨 있었어요.`, 확정: ["녹음 — 01:38 문고리"] } } }],
    "01:40의 메모": { 답: `남의 메모를… 하. (한참 말이 없다) 기도실 앞에 갔어요. 한 시 반쯤. 그런데 문이 열리더니 세림 씨가 나왔어요. 뒷걸음질로. 얼굴이 하얗게 질려서. 열쇠로 문 잠그고 도망갔어요. 그래서 아무 것도 못하고 왔어요. 됐죠?`, 새증거: "태영의 증언 — 01:36", 확정: ["01:40의 메모"], 알면: { "태영의 증언 — 01:36": `이미 다 말했잖아요. 한 시 반, 세림 씨, 잠긴 문. 못 했다. 그게 전부예요.` } },
    "음원 사재기 정산서": `…알고 있었어요. 1위 하던 날 밤에 매니저 형이 말해 줬어요. ‘교단이 산 거야. 그러니까 서명해.’ 그날 저 무대에서 울었어요. 생방송으로. 그 눈물도 4억짜리였네요.`,
    "태영 가방 속 팬레터": `(날이 선 목소리가 꺾인다) …이건 건드리지 마세요. 이 편지만은 진짜잖아요. 그 애는 진짜로 제 노래 듣고 버텼대요. 그런데 그 노래 1위는 가짜예요. 그걸 그 애가 알면….`,
    "매니저와의 대화": `정모 형이랑 성민이 부탁이었어요. 형이 저한테 처음으로 뭘 부탁했어요. 다섯 시 반. 저도 같이 떠날 거였고요. 이건 기사에 쓰지 마세요.`,
    "교단 전화 통화 기록": [`모르겠어요. 매니저 형이 아버지랑 통화할 일이야 많죠.`, `다섯 시 반. 다 알고 있었네. 저만 몰랐고. 웃기지도 않아요.`],
    "데뷔 포스터": `2020년 4월 14일. 저한텐 생일보다 중요한 날이에요. …이었어요. 이제는 모르겠어요.`,
    "녹음 파일의 23:52": `그때 저는 허밍하고 있었어요. 우빈 형제님 기타에 맞춰서. 들어 보세요. 음정도 안 틀렸어요.`,
    "목의 붉은 줄": [`…몰라요. 왜 저를 보세요?`, `칼라 자국이라면서요. 제 넥타이 아니에요. 그러니까 그만 좀 쳐다보세요.`],
    "세림의 고백": `…세림 씨도 그 방 앞에서 저랑 같은 생각을 했겠죠. 근데 세림 씨는 들어갔고, 저는 못 들어갔어요.`
  },

  인정: {
    "늘어난 넥타이": `…제 거예요. 무대용이요. 늘어난 건 긴장하면 쥐어뜯는 버릇 때문이고요. 이것도 기사 나가요?`
  },

  끼어들기: {
    "면담 일지": `그 말, 다들 들었어요. 근데 솔직히 그 생각 정모 형만 한 거 아닐걸요. 여기 있는 사람 다.`
  },

  최종추궁: [
    [`당신은 10년짜리 족쇄에 서명해야 했습니다.`, `서명 안 하면 가짜 1위가 공개돼요. 제 인생 끝이고, 그 편지 쓴 애도 그걸 알게 되고요.`],
    [`01:38, 당신은 기도실 문고리를 당겼습니다.`, `잠겨 있었어요. 그리고 세림 씨가 막 거기서 나온 참이었고요. 몇 번을 말해요.`],
    [`마지막으로 묻겠습니다. 교주를 죽였습니까?`, `…못 했어요. 메모에 쓴 그대로예요. 못 했다. 저는 그 정도도 못 하는 사람이에요.`]
  ],
  반박유형: {"시간": ["23:52에 저 우빈 형제님이랑 찬양팀실에 있었어요. 녹음 들어 보세요. 제 목소리 나와요.", "한 시 반쯤 나간 건 맞아요. 근데 그건 연통 막힌 지 한참 뒤잖아요."], "소문": ["누가 그랬어요? 그런 말 퍼지면 저 진짜 끝나요.", "그거 다 루머예요. 루머 대응은 연습 많이 했어요."], "증언": ["그 말이 맞긴 한데… 그게 저를 범인이라고 하는 건 아니잖아요.", "도망가려던 건 맞아요. 도망가려는 사람이 굳이 사람을 죽여요?"], "기타": ["그거 회사 일이에요. 저도 피해자라고요.", "그걸로 저를 범인이라고 하면… 이거 기사에 나가는 거 아니죠?"]},
  증거반박: {
    "01:40의 메모": [`01:40, 당신은 기도실 앞에 있었습니다.`, `문이 잠겨 있었어요. 그리고 그땐 이미… 안에서 아무 소리도 안 났어요.`],
    "늘어난 넥타이": [`이 넥타이를 쥐고 기도실에 갔습니다.`, `목 자국은 칼라랑 같은 3.5cm래요. 제 넥타이는 매듭이 두꺼워요. 확인해 보세요.`],
    "녹음 — 01:38 문고리": [`01:38, 당신은 문고리를 잡아당겼습니다.`, `당겼어요. 잠겨 있었어요. 그리고 그 사람은 01:02에 이미 쓰러져 있었다면서요.`]
  }
});

/* =====================================================================
   안성민 대사 (sungmin.js) — 진범
   말투: 이미 세상을 다 알아 버려 순진함을 잃은 말투. 짧고 조용하고 건조하다. 정모 이야기에서만 잠깐 흔들린다.
   `백틱` 안의 글자만 고치면 됩니다. 백틱(`), 쉼표, 괄호는 지우지 마세요.
   증거 이름은 evidence.js의 n(이름)과 똑같아야 합니다.

   '최종변론'은 진범을 지목했을 때 이어지는 추궁입니다.
   - 변명: 성민의 변명
   - 보증: 변명 직후 끼어드는 사람들 [인물id, 대사]
   - 증거: 이 변명을 깨는 증거 이름(여러 개면 그중 아무거나 정답)
   - 탐정: 증거를 내밀 때 탐정의 말
   - 반박: 증거를 내민 뒤 끼어드는 사람들 [인물id, 대사]
   - 물러섬: 성민이 한발 물러서는 말 (마지막 장면은 비워 두면 바로 엔딩)
   - 장면 / 설명: 진범 페이지의 '결정적 증거' 칸에 들어가는 문장
   ===================================================================== */
인물({
  id: "sungmin", 이름: "안성민", 나이: 22, 이니셜: "안",
  역할: "기도실 시중 · 모태신앙",
  사진: "",

  관계: `이 마을에서 태어났어요. 아버지가 세상의 전부라고 배웠어요. 다들 그렇게 배웠죠. 그런데 다들 잊어버린 것 같아요. 저는 안 잊었어요. 매일 밤 기도실에 차를 올리는 시중이에요. 그건 영광이에요. …정말로요.`,
  알리바이: `기도회 중간에 아버지가 내보내셨어요. 차 준비하라고. 열한 시 사십 분에 차랑 장작 올리고, 사십오 분에 나와서 숙소로 갔어요. 그 뒤로는 형이랑 방에 있었어요.`,
  알리바이요약: `22:41 기도회에서 먼저 나옴, ~23:30 식당(대추차), 23:30 창고 장작, 23:40~23:45 기도실 시중, 곧장 1호실. 이후 정모와 함께.`,

  지목1: `저요? …차만 드렸어요. 그때 아버지는 직접 문을 잠그셨어요. 살아 계셨어요. 그건 녹음이 있으면 녹음이 말해 주겠죠.`,
  지목2: `연통이요? 탐정님, 이 마을 사람들은 다 그 난로가 어떻게 생겼는지 알아요. 저만 아는 게 아니에요. 저는 밤새 방에 있었어요.`,
  오답엔딩: ``,

  모른다: [`몰라요.`, `…그건 제가 할 말이 없어요.`, `알아서 좋을 게 없는 일도 있잖아요.`],
  아니다: [`제 거 아니에요.`, `처음 봐요.`],
  누가: [`저 아니에요.`, `모르죠. 여기선 다들 모르는 척하니까.`],
  잘모르는곳: `{장소} 일은 몰라요. 저는 시중이라서요.`,
  안간곳: `그날 밤 {장소}엔 안 갔어요.`,
  내물건아님: `제 {물건} 아니에요.`,


  증거답변: {
    "카펫 밑의 바닥 문": `…알아요. 시중은 그 위를 걸어 다녀요. 매일 밤. 소리 나면 안 돼요.`,
    "지하 회개실": `(손전등 빛을 피한다) 회개하는 곳이에요. 아버지가 그렇게 말씀하셨어요.`,
    "연통 받침의 반사 실밥": `…그 패딩, 다들 입고 다녀요. 겨울엔.`,
    "녹음 — 04:45 마지막": `그 시간엔… 화장실에 있었어요. 저는 몰라요.`,
    "벽으로 돌려진 사진들": `(사진 쪽을 보지 않는다) …아버지는 돌려놔도 보세요. 다 보세요.`,
    "시중 보고 수첩": `…네. 시중은 원래 그래요. 아버지의 눈이에요. 보고하는 건 사랑이라고 배웠어요. 지윤 누나도… 제가 썼어요. 그다음 주에 명단에 올라갔어요. (아주 조용히) 형 칸은 비어 있죠. 아무리 써도 형은 못 쓰겠더라고요. 그래서 어제 그만 썼어요. 그게 제가 처음으로 아버지를 거역한 거예요.`,
    "기도회 녹음": `아버지가 저를 내보내셨어요. ‘시중은 가서 차를 준비하거라.’ 매일 하시는 말이에요. 회개할 사람이요? …아버지는 틀리신 적이 없어요. 한 번도.`,
    "이체 확인증": `세림 실장님이요? …몰라요. 저는 시중이라서요.`,
    "피 묻은 촛대": `강대상 오른쪽에 있던 거예요. 제가 매일 밤 불을 붙여요. 어젯밤에도요.`,
    "꺼진 장작 난로": `제가 넣었어요. 매일 밤 열한 시 사십 분에 여섯 개. 하루도 안 빠지고요.`,
    "난로 속 장작": `…저는 장작 넣고 나왔어요. 그 뒤는 몰라요.`,
    "녹음 — 23:40 시중": `…말하면 다들 저를 의심할 거잖아요. 그래서 안 했어요. 그래도 저는 ‘편히 쉬십시오’라고 했어요. 들으셨죠.`,
    "교단 소유 주택 명단": [`저희 집이에요. 왜 퇴거라고 적혀 있는지는… 모르겠어요.`, `아버지가 그러셨어요. 형이 기름부음 받는 날, 우리 가족은 마을을 떠난다고. 엄마 아빠는 아직 몰라요. 알면… 저를 원망하겠죠. 아니면 제 장례 예배를 드리든가.`],
    "성민의 성경 속 사진": `작년 겨울에 형이랑 몰래 나갔을 때예요. 버스로 네 시간. 하루 만에 돌아왔어요. 돌아오지 말 걸 그랬어요.`,
    "성민의 패딩": `기도실 난로에 장작 넣다가 그을린 거예요.`,
    "성민의 기도 수첩": `…기도는 원래 그런 거잖아요. 다들 자기는 용서받을 자격이 없다고 해요. 저만 그런 거 아니에요.`,
    "기도실 시중 카트": [`봉투는 아침에 난로 재 담는 데 써요. 한 장 비었으면… 어제 아침에 쓴 거겠죠. 테이프는 창 비닐 붙이는 거고요.`, `재 담는 봉투예요. 테이프는 창 비닐 붙이는 거고요. 시중이 하는 일이에요. 그게 다예요.`],
    "기도실 수칙": `외투는 문밖에서 벗어요. 매일 밤 그렇게 해요. 십 년째.`,
    "풀린 뒷문 걸쇠": `그 문은… 원래 자주 열려 있어요. 관리자분이 깜빡하나 보죠.`,

function qaBlock(id,compact){

    return `<button class="loc ${l.id===L.id?"on":""}" data-loc="${l.id}">${esc(l.name)}${locLocked(l)?" 🔒":`<span class="n">${un}</span>`}${nw?`<span class="new">NEW</span>`:""}</button>`;
  }).join("");

  const cur=S.sub&&rootOf(S.sub)===L.id?S.sub:L.id,sub=SUBS[cur];

/* ================== Episode R 확장 ==================
   시계 · 조사 횟수 · 실시간 사건 · 거짓말 찌르기(대질) · 용의선상 · 핵심 질문
   사인 추리 · 23:52 재구성 · 대예배당 대치 · 소리
   ==================================================== */
P.forEach(p=>{
  const o=CHARS.find(x=>x.id===p.id)||{};
  p.lies=(o.거짓말||[]).map((l,i)=>({i,t:l.말||"",r:l.차수||1,

    y:l.무너짐||"",g:l.새증거?rid(l.새증거,`${o.이름} 파일 · 거짓말`):null,no:l.헛짚음||null}));
  p.miss=o.헛짚음||null;
});
const QS=(K.핵심질문||[]).map(q=>({q:q.질문,a:q.답,ids:(q.풀림||[]).map(n=>rid(n,"case.js · 핵심질문")).filter(Boolean)}));

  opts:(e.선택||[]).map(o=>Object.assign({},o,{giveIds:(o.준다||[]).map(n=>rid(n,"case.js · 사건발생 · 선택")).filter(Boolean)}))}));
const RC=K.재구성||null;
if(RC)RC.ok=Object.fromEntries(Object.entries(RC.증거||{}).map(([pid,ns])=>[pid,ns.map(n=>rid(n,"case.js · 재구성")).filter(Boolean)]));
const CAUSE=K.사인추리||null;
if(CAUSE&&CAUSE.증거)CAUSE.cid=rid(CAUSE.증거,"case.js · 사인추리");

/* ----- 시계 ----- */
const CLK=K.시계||{};
const t2m=t=>{const [h,m]=String(t).split(":").map(Number);return h*60+(m||0)};
const m2t=m=>String(Math.floor(m/60)%24).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
const SCALE={1:A.filter(a=>a.r===1&&a.c).length,2:A.filter(a=>a.c).length-A.filter(a=>a.r===1&&a.c).length*0.5};
const capOf=R=>CLK[R]?(CLK[R].횟수||Math.round(SCALE[R])||30):Infinity;
const usedOf=R=>(S.used||{})[R]||0;
const leftOf=R=>capOf(R)-usedOf(R);
const nowOf=R=>{const c=CLK[R];if(!c)return "";const cap=capOf(R),u=Math.min(usedOf(R),cap);
  const pts=[[0,t2m(c.시작)],...(K.사건발생||[]).filter(e=>e.r===R&&/^\d{1,2}:\d{2}$/.test(e.시각||"")&&e.at<cap).map(e=>[e.at,t2m(e.시각)]).sort((a,b)=>a[0]-b[0]),[cap,t2m(c.끝)]];
  for(let i=1;i<pts.length;i++){const [a0,m0]=pts[i-1],[a1,m1]=pts[i];if(u<=a1)return m2t(Math.round(m0+(m1-m0)*(a1===a0?1:(u-a0)/(a1-a0))));}
  return m2t(t2m(c.끝));};
function spend(R,n){S.used=S.used||{1:0,2:0};S.used[R]=(S.used[R]||0)+n;checkEvents(R);}
function clockHTML(R){

/* ----- 실시간 사건 ----- */
function checkEvents(R){
  EVS.forEach(e=>{
    if(e.r!==R||(S.ev||{})[e.id]||usedOf(R)<e.at)return;
    if(e.needIds.some(id=>!has(id)))return;

    e.give.forEach(id=>{if(!has(id))S.found.push(id)});

   <div class="prose">${e.회상&&PM[e.주인]?`<p class="fbin">${esc(PM[e.주인].name)}의 말끝이 흐려진다. 그날이, 아직 거기 있다.</p>`:""}${(e.글||[]).map(t=>`<p>${esc(t)}</p>`).join("")}${evExtra(e)}${e.훼손?`<p class="${ruined?"bad":"good"}">${esc(ruined?e.훼손.늦음:e.훼손.무사)}</p>`:""}${e.give.map(id=>`<div class="evgive">${viewHTML(CM[id])}<p class="good">→ 새 증거: ${esc(CM[id].n)}</p></div>`).join("")}</div>

}
const evBlocked=e=>(e.opts.length&&(S.evCh||{})[e.id]===undefined)||(e.질문&&!(S.evQ||{})[e.id+"_ok"]);

/* ----- 거짓말 찌르기 ----- */
const lieKey=(pid,i)=>pid+"|"+i;
const liesOf=(p,R)=>(p.lies||[]).filter(l=>l.r<=R);
function judgeLie(pid,i,cid){
  const p=PM[pid],l=p.lies[i],R=round();S.lie=S.lie||{};
  if(l.ev.includes(cid)){
    S.lie[lieKey(pid,i)]=1;S.lieMsg={k:lieKey(pid,i),ok:1,t:l.y};
    if(l.g&&!has(l.g)){S.found.push(l.g);S.lieMsg.g=l.g;}
    sfx("thud");
  }else{
    const pool=l.no?[l.no]:(p.miss&&p.miss.length?p.miss:["그게 무슨 상관입니까?","…그걸로 뭘 증명하시려고요?","잘못 짚으셨네요."]);
    S.lieMsg={k:lieKey(pid,i),ok:0,t:rnd(pool)};
    if(CLK[R]&&(S.phase==="inv1"||S.phase==="inv2")&&leftOf(R)>0){spend(R,1);S.lieMsg.cost=1;}
    sfx("buzz");
  }
  S.liePick=null;save();render();
}

     ${msg?`<div class="liemsg ${msg.ok?"ok":"no"}"><b>${esc(p.name)}</b> ${esc(msg.t)}${msg.g?`<span class="gave">새 증거 · ${esc(CM[msg.g].n)}</span>`:""}${msg.cost?`<span class="cost">헛짚었다 · 조사 1회 소모</span>`:""}</div>`:""}
     ${done?"":(S.liePick===k?`<div class="liepick"><p class="hint">이 말을 깨는 증거를 고른다.</p>${S.found.map(id=>`<button class="chip" data-liev="${id}">${esc(CM[id].n)}</button>`).join("")}<button class="ghost sm" data-liex>그만두기</button></div>`:`<button class="ask" data-lie="${k}">이 말을 찌른다 — 증거 제시</button>`)}</div>`;

/* ----- 사인 추리 ----- */

function gameHTML(){

  let body="";
  if(g.type==="puzzle"){
    if(!S.gs.ord){const n=g.조각.length;const base=[3,0,5,1,4,2,7,6];let o=base.filter(x=>x<n);while(o.length<n)o.push(o.length);S.gs.ord=o;}
