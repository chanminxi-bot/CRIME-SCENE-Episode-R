  }else if(g.type==="tape"){
    const rv=!!S.gs.rev,sp=S.gs.sp||1,ok=rv&&sp===g.속도;S.gs.ok=ok&&S.gs.heard;
    const h=g.숨은말,mask=t=>t.split("").map((ch,i)=>/[\s.,]/.test(ch)?ch:((i*7)%3===0?ch:"·")).join("");
    const shown=!S.gs.heard?"[테이프가 돌기를 기다린다]":ok?h:rv?mask(h):"[알아들을 수 없는 웅얼거림. 찬송이 늘어진다]";
    body=`<div class="gtape"><div class="gtrow"><button class="ghost ${rv?"on":""}" data-grev>${rv?"◀◀ 거꾸로":"▶▶ 정방향"}</button>${[0.5,0.75,1,1.5].map(x=>`<button class="ghost ${sp===x?"on":""}" data-gsp="${x}">${x}×</button>`).join("")}</div>
      <button class="primary" data-gplay>▶ 재생</button><p class="gout ${ok&&S.gs.heard?"clear":""}">${esc(shown)}</p></div>`;
  }else if(g.type==="knock"){
    const hit=S.gs.hit||[];S.gs.ok=hit.includes(g.정답);
    body=`<div class="gknock">${Array.from({length:g.판},(_,i)=>`<button class="gpanel ${hit.includes(i)?(i===g.정답?"hollow":"solid"):""}" data-gknock="${i}">${hit.includes(i)?(i===g.정답?"텅—":"똑, 똑"):""}</button>`).join("")}</div>
      ${S.gs.ok?`<p class="gout clear">${S.gs.answer?"…벽 너머에서, 누군가 세 번 두드린다.":"이 칸만 속이 비어 있다."}</p>`:""}`;
  }else if(g.type==="meter"){
    const m=S.gs.m||[];S.gs.ok=g.순서?m.length===g.자리.length:m.includes(g.정답);const cur=S.gs.cur;
    body=`<div class="gmeter"><div class="gmread ${cur===g.정답?"hot":""}">${cur===undefined?"-- ppm":esc(g.값[cur])+" ppm"}${cur!==undefined&&g.말?`<small class="gmsay">${esc(g.말[cur])}</small>`:""}</div><div class="gmspots">${g.자리.map((p,i)=>`<button class="ghost ${m.includes(i)?"on":""}" data-gmeter="${i}" ${g.순서&&(m.includes(i)||i!==m.length)?"disabled":""}>${esc(p)}${m.includes(i)?` · ${esc(g.값[i])}`:""}</button>`).join("")}</div></div>
      ${S.gs.ok?`<p class="gout clear">${g.순서?"삐— 삐— 삐—. 측정기가 쉬지 않고 운다. 숫자가 더는 내려가지 않는다.":"삐— 삐— 삐—."}</p>`:""}`;
  }
  return `<div class="pop-ov gameov"><div class="pop gamepop" role="dialog" aria-label="${esc(a.d)}"><span class="eyebrow">직접 해 보기</span><h2>${esc(a.d)}</h2><p class="hint">${esc(g.안내||"")}</p>${body}
   <div class="row2"><button class="ghost" data-gquit>그만두기</button>${S.gs.ok?`<button class="primary" data-gdone>${g.type==="knock"?"벽돌을 빼낸다":g.type==="meter"?"수치를 적는다":g.type==="tape"?"들은 것을 적는다":"맞춘 종이를 읽는다"}</button>`:""}</div></div></div>`;
}

  v.querySelectorAll("[data-gstrip]").forEach(x=>x.onclick=()=>{const i=+x.dataset.gstrip;if(S.gs.ok)return;if(S.gs.sel===undefined||S.gs.sel===null){S.gs.sel=i;}else{const o=S.gs.ord,j=S.gs.sel;[o[i],o[j]]=[o[j],o[i]];S.gs.sel=null;sfx("tape");}rr();});
  v.querySelectorAll("[data-grev]").forEach(x=>x.onclick=()=>{S.gs.rev=!S.gs.rev;S.gs.heard=false;rr();});

/* ----- 소리 ----- */
let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null}}return AC}
function sfx(kind){
  if(S.mute)return;const a=ac();if(!a)return;try{
  const t=a.currentTime,g=a.createGain();g.connect(a.destination);
  if(kind==="tape"){const len=a.sampleRate*0.9,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*0.25*(1-i/len);
    const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=1800;s.connect(f);f.connect(g);g.gain.value=0.5;s.start(t);}
  else if(kind==="thud"){const o=a.createOscillator();o.type="sine";o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(38,t+.5);o.connect(g);g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.7);o.start(t);o.stop(t+.7);}
  else if(kind==="buzz"){const o=a.createOscillator();o.type="square";o.frequency.value=110;o.connect(g);g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.25);}
  else if(kind==="sting"){const nb=a.createBuffer(1,a.sampleRate*.9,a.sampleRate),dd=nb.getChannelData(0);for(let i=0;i<dd.length;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/dd.length,3);const ns=a.createBufferSource();ns.buffer=nb;const ng=a.createGain();ng.gain.value=.22;ns.connect(ng);ng.connect(a.destination);ns.start(t);
    [55,58.3,82.4,116.5].forEach(f=>{const o=a.createOscillator();const gg=a.createGain();o.type="sawtooth";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.94,t+1.4);o.connect(gg);gg.connect(a.destination);gg.gain.setValueAtTime(.0001,t);gg.gain.exponentialRampToValueAtTime(.09,t+.03);gg.gain.exponentialRampToValueAtTime(.0001,t+1.5);o.start(t);o.stop(t+1.6);});}
  else if(kind==="knock"){[0,.18,.36].forEach(d=>{const o=a.createOscillator();const gg=a.createGain();o.type="triangle";o.frequency.setValueAtTime(140,t+d);o.frequency.exponentialRampToValueAtTime(60,t+d+.08);o.connect(gg);gg.connect(a.destination);gg.gain.setValueAtTime(.5,t+d);gg.gain.exponentialRampToValueAtTime(.001,t+d+.12);o.start(t+d);o.stop(t+d+.13);});}
  else if(kind==="heart"){[0,.22].forEach((d,i)=>{const o=a.createOscillator();const gg=a.createGain();o.type="sine";o.frequency.setValueAtTime(62,t+d);o.frequency.exponentialRampToValueAtTime(34,t+d+.18);o.connect(gg);gg.connect(a.destination);gg.gain.setValueAtTime(i?.32:.45,t+d);gg.gain.exponentialRampToValueAtTime(.001,t+d+.24);o.start(t+d);o.stop(t+d+.26);});}
  else if(kind==="choir"){[220,261.6,329.6].forEach(fq=>{const o=a.createOscillator();const gg=a.createGain();o.type="sine";o.frequency.value=fq;o.connect(gg);gg.connect(a.destination);gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(.05,t+.8);gg.gain.linearRampToValueAtTime(0,t+3.2);o.start(t);o.stop(t+3.3);});}
  }catch(e){}
}

  v.querySelectorAll("[data-truth]").forEach(b=>b.onclick=()=>{S.showTruth=true;go("truth");});
  v.querySelectorAll("[data-toend]").forEach(b=>b.onclick=()=>go("end"));
  v.querySelectorAll("[data-reacc]").forEach(b=>b.onclick=()=>{S.ending=null;S.accused=null;S.showTruth=false;go("acc2");});
  v.querySelectorAll("[data-cf]").forEach(x=>x.onclick=()=>{S.cf=true;save();render();});
  v.querySelectorAll("[data-cfclose]").forEach(x=>x.onclick=()=>{S.cf=false;const first=!S.cfSeen;S.cfSeen=true;save();render();if(first)window.scrollTo(0,document.body.scrollHeight);});
  v.querySelectorAll("[data-opennb]").forEach(b=>b.onclick=()=>{S.nb=true;renderNote();});
  bindAsk(v);
}
$("brand").textContent=K.제목||"";
if(K.제목)document.title=K.제목;
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("[data-pin]");if(!b)return;e.preventDefault();e.stopPropagation();S.pin=S.pin||{};const id=b.dataset.pin;if(S.pin[id])delete S.pin[id];else S.pin[id]=1;save();const on=!!S.pin[id];document.querySelectorAll(`[data-pin="${id}"]`).forEach(x=>{x.classList.toggle("on",on);x.textContent=on?"★":"☆";});},true);
$("nbbtn").onclick=()=>{S.nb=true;S.askFor=null;renderNote();};
$("nbclose").onclick=()=>{S.nb=false;S.askFor=null;renderNote();};
$("overlay").onclick=e=>{if(e.target.id==="overlay"){S.nb=false;renderNote();}};
/* ----- 녹음기 재생 ----- */
let RPT=null;
function recShow(id,k,now){S.rp=S.rp||{};document.querySelectorAll(`.ev-rec[data-rid="${id}"]`).forEach(el=>{const li=[...el.querySelectorAll("li")];li.forEach((x,i)=>{x.classList.toggle("hid",i>=k);x.classList.toggle("now",now&&i===k-1);});
  const r=el.querySelector("[data-scrub]");if(r)r.value=k;const ps=el.querySelector(".rpos");if(ps)ps.textContent=k?li[k-1].querySelector("time").textContent:"--:--";const w=el.querySelector(".rwait");if(w&&k)w.remove();
  if(now&&k&&li[k-1].querySelector(".hot")){el.classList.remove("flash");void el.offsetWidth;el.classList.add("flash");}});}
let RPID=null;
document.addEventListener("click",e=>{const b=e.target.closest("[data-play]");if(!b)return;const id=b.dataset.play,c=CM[id];const n=[].concat(c.v).find(v=>v.type==="rec").lines.length;
  const lbl=t=>document.querySelectorAll(`[data-play="${id}"]`).forEach(x=>x.textContent=t);
  if(RPID===id){clearInterval(RPT);RPID=null;lbl("▶ 이어서 듣기");return;}
  clearInterval(RPT);if(RPID)document.querySelectorAll(`[data-play="${RPID}"]`).forEach(x=>x.textContent="▶ 이어서 듣기");
  S.rpos=S.rpos||{};let k=S.rpos[id]||0;if(k>=n)k=0;RPID=id;sfx("tape");recShow(id,k,true);lbl("❚❚ 멈춤");
  RPT=setInterval(()=>{k++;S.rpos[id]=k;recShow(id,k,true);S.rp[id]=Math.max(S.rp[id]||0,k);if(k>=n){clearInterval(RPT);RPID=null;lbl("↺ 다시 듣기");save();}},1150);});
document.addEventListener("input",e=>{const r=e.target.closest("[data-scrub]");if(!r)return;clearInterval(RPT);const id=r.dataset.scrub,k=+r.value;S.rpos=S.rpos||{};S.rpos[id]=k;if(RPID===id){RPID=null;document.querySelectorAll(`[data-play="${id}"]`).forEach(x=>x.textContent="▶ 이어서 듣기");}S.rp=S.rp||{};S.rp[id]=Math.max(S.rp[id]||0,k);recShow(id,k,false);save();});
document.addEventListener("keydown",e=>{if(e.key!=="Escape")return;if(S.nb){S.nb=false;renderNote();}else if(S.lockOpen){S.lockOpen=null;render();}else if(S.pop){S.pop=false;render();}});
if(ERR.length){const d=document.createElement("div");d.className="dataerr";d.innerHTML="<b>데이터 파일 확인 필요 ("+ERR.length+")</b>"+ERR.map(esc).join("<br>");document.body.appendChild(d);console.warn(ERR.join("\n"));}
try{render()}catch(e){const d=document.createElement("div");d.className="dataerr";d.textContent="화면 오류: "+e.message;document.body.appendChild(d);throw e}
</script>
